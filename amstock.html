<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Catalogue Produits Finis — AMplast">
    <meta name="theme-color" content="#1b4332">
    <title>Produits Finis — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b4332;
            --primary-light: #2d6a4f;
            --primary-soft: #52b788;
            --accent: #e8651a;
            --bg-color: #f1f8f4;
            --bg-body: #e0ebe4;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --amount-color: #e8651a;

            --status-regle: #2d6a4f;
            --status-regle-bg: #d8f3dc;
            --status-echu: #c1121f;
            --status-echu-bg: #fde2e4;
            --status-attente: #e8651a;
            --status-attente-bg: #fde8d8;
            /* Nuance spécifique Produits : Ambre / Doré / Or Chaud */
            --page-accent: #d97706;
            --page-accent-light: #fbbf24;
            --page-accent-bg: #fffbeb;
            --page-accent-border: rgba(217, 119, 6, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        /* ===== HEADER IDENTIQUE À CLIENTSAM ===== */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 16px 16px 20px 16px;
            border-radius: 0 0 24px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 16px rgba(27, 67, 50, 0.25);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateX(-2px);
        }
        .back-btn:active { transform: scale(0.94); }

        .brand-meta {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #fde68a;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-new {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(217, 119, 6, 0.35);
            transition: all 0.15s;
        }
        .btn-new:hover { filter: brightness(1.08); }
        .btn-new:active { transform: scale(0.95); }

        .total-badge {
            background: rgba(255,255,255,0.15);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        /* Bannière Solde/KPI en-tête */
        .total-solde {
            background: rgba(255,255,255,0.12);
            padding: 12px 14px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(4px);
        }

        .total-label {
            font-size: 12px;
            opacity: 0.95;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .total-amount {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 800;
            color: #ffb088;
        }

        /* Barre de recherche */
        .search-container {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 38px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.97);
            font-size: 13px;
            color: var(--text-main);
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
            font-weight: 600;
        }
        .search-input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 0 2px var(--page-accent-light);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 13px;
        }

        /* Onglets filtres */
        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            white-space: nowrap;
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.85);
        }

        .tab-btn.active {
            background: white;
            color: var(--page-accent);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* ===== MINI STATS BAR (3 CARTES) ===== */
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 12px 14px 4px 14px;
        }

        .stat-card {
            background: white;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid rgba(82, 183, 136, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(27, 67, 50, 0.04);
        }

        .stat-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-val {
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== LISTE DES PRODUITS ===== */
        .items-list {
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 1px 4px rgba(27, 67, 50, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.15s;
            border: 1px solid rgba(82, 183, 136, 0.12);
            cursor: pointer;
        }
        .item-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.08);
            border-color: var(--page-accent-light);
        }
        .item-card:active { transform: scale(0.98); }

        .item-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }
        .item-card.regle::before { background: var(--status-regle); }
        .item-card.echu::before { background: var(--status-echu); }
        .item-card.attente::before { background: var(--status-attente); }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 13px;
            color: white;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #d97706 0%, #fbbf24 100%);
            box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-family: 'Outfit', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #1a1a1a;
        }

        .item-meta-line {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .cat-tag {
            background: var(--page-accent-bg);
            color: var(--page-accent);
            border: 1px solid var(--page-accent-border);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .badge-source {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .badge-prod {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }
        .badge-achat {
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .tag-qualite {
            font-size: 9.5px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 5px;
            display: inline-block;
        }
        .tag-s1 {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
        }
        .tag-s2 {
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }

        .attr-pill {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            font-weight: 700;
            color: #4b5563;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .form-section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--primary-mid);
            margin-top: 6px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .form-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(45, 106, 79, 0.15);
        }

        .tag-stock-low {
            background: var(--status-echu-bg);
            color: var(--status-echu);
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .amount {
            font-family: 'Outfit', sans-serif;
            font-size: 13.5px;
            font-weight: 800;
            color: var(--text-main);
        }

        .price-badge {
            font-family: 'Outfit', sans-serif;
            font-size: 12.5px;
            font-weight: 800;
            color: var(--amount-color);
        }

        .status-pill {
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .pill-regle { background: var(--status-regle-bg); color: var(--status-regle); }
        .pill-echu { background: var(--status-echu-bg); color: var(--status-echu); }
        .pill-attente { background: var(--status-attente-bg); color: var(--status-attente); }

        .eco-footer {
            text-align: center;
            padding: 16px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.8;
            margin-top: auto;
        }

        /* ===== MODAL BOTTOM SHEET (STYLE CLIENTSAM) ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 200;
            display: none;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            background: var(--bg-color);
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            border-radius: 28px 28px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 16px 18px;
            position: relative;
            flex-shrink: 0;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); }

        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 2px;
            padding-right: 36px;
        }

        .modal-subtitle {
            font-size: 11px;
            color: #95d5b2;
            font-weight: 600;
        }

        .modal-body {
            padding: 16px 18px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-card {
            background: white;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 1px 4px rgba(27, 67, 50, 0.05);
            border: 1px solid rgba(82, 183, 136, 0.14);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid #d1d5db;
            font-size: 13px;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--page-accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.14);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-submit {
            padding: 11px 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(217, 119, 6, 0.3);
            transition: all 0.15s;
            margin-top: 6px;
        }
        .btn-submit:hover { filter: brightness(1.1); }
        .btn-submit:active { transform: scale(0.98); }

        /* Option buttons (Pills Radio S1/S2 et Source) */
        .radio-pill-group {
            display: flex;
            gap: 6px;
            height: 32px;
        }
        .radio-pill {
            flex: 1;
            display: flex;
            position: relative;
            cursor: pointer;
            margin: 0;
        }
        .radio-pill input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .radio-pill .pill-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            border: 1.5px solid #d1d5db;
            background: #ffffff;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            transition: all 0.15s ease;
            user-select: none;
        }
        .radio-pill input:checked + .pill-btn {
            border-color: var(--page-accent);
            background: var(--page-accent-bg);
            color: var(--page-accent);
            box-shadow: 0 1px 4px rgba(217, 119, 6, 0.2);
        }

        /* Mode compact STRICT sans défilement pour add-modal */
        #add-modal .modal-sheet {
            max-height: 94vh;
            border-radius: 24px 24px 0 0;
        }
        #add-modal .modal-header {
            padding: 11px 16px;
        }
        #add-modal .modal-title {
            font-size: 15px;
            margin-bottom: 0;
        }
        #add-modal .modal-subtitle {
            font-size: 10px;
        }
        #add-modal .modal-close {
            width: 28px;
            height: 28px;
            top: 10px;
            right: 12px;
            font-size: 16px;
        }
        #add-modal .modal-body {
            padding: 10px 14px 16px;
            gap: 6px;
            overflow: hidden !important; /* AUCUNE barre de défilement */
        }
        #add-modal .form-group {
            margin-bottom: 0;
            gap: 2px;
        }
        #add-modal .form-group label {
            font-size: 10px;
            font-weight: 700;
            color: #374151;
        }
        #add-modal .form-control {
            padding: 5px 9px;
            height: 31px;
            font-size: 12px;
            border-radius: 8px;
        }
        #add-modal .form-row {
            gap: 6px;
        }
        #add-modal .btn-submit {
            padding: 8px 12px;
            height: 35px;
            font-size: 12px;
            margin-top: 2px;
            border-radius: 9px;
        }

        .btn-action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-action-sheet {
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action-sheet:active { transform: scale(0.96); }

        .btn-in-stock {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .btn-out-stock {
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #fed7aa;
        }

        .btn-delete-item {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
            padding: 8px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn" title="Retour au Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="brand-meta">
                    <div class="brand-name">CATALOGUE &amp; STOCK</div>
                    <div class="header-title">Produits Finis</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick="openAddModal()">+ Nouveau</button>
                <span class="total-badge" id="kpi-count">5 références</span>
            </div>
        </div>

        <div class="total-solde">
            <span class="total-label">📦 Valeur Totale du Stock</span>
            <span class="total-amount" id="highlight-valeur">0 DH</span>
        </div>

        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher produit, diamètre, norme..." autocomplete="off">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Tous</button>
            <button class="tab-btn" data-filter="Tuyaux PEHD">Tuyaux PEHD</button>
            <button class="tab-btn" data-filter="Irrigation">Irrigation</button>
            <button class="tab-btn" data-filter="Film Agricole">Film Agricole</button>
            <button class="tab-btn" data-filter="Gaine Industrielle">Gaines</button>
        </div>
    </header>

    <!-- Quick mini stats -->
    <div class="stats-bar">
        <div class="stat-card">
            <span class="stat-label" style="color: #2d6a4f;">✓ En Stock</span>
            <span class="stat-val" id="kpi-en-stock" style="color: #1b4332;">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="color: #c1121f;">⚠️ Stock Bas</span>
            <span class="stat-val" id="kpi-stock-bas" style="color: #c1121f;">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="color: #e8651a;">📦 Unités Total</span>
            <span class="stat-val" id="kpi-total-unites" style="color: #e8651a;">-</span>
        </div>
    </div>

    <!-- Items Cards Grid -->
    <div class="items-list" id="items-list"></div>

    <div class="eco-footer">🌿 AM • Gestion écologique & responsable</div>
</div>

<!-- ===== MODAL DETAIL PRODUIT (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeDetail()">×</button>
            <div class="modal-title" id="det-name">Produit</div>
            <div class="modal-subtitle" id="det-cat">Catégorie</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- Content injected dynamically -->
        </div>
    </div>
</div>

<!-- ===== MODAL NOUVEAU PRODUIT (SANS DÉFILEMENT) ===== -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <div class="modal-title">Nouveau Produit Fini</div>
            <div class="modal-subtitle">Catalogue &amp; Gestion Stock AMplast</div>
        </div>
        <form id="add-form" class="modal-body">
            <!-- Row 1: Source & Qualité (Option buttons S1 / S2) -->
            <div class="form-row">
                <div class="form-group">
                    <label>Source *</label>
                    <div class="radio-pill-group">
                        <label class="radio-pill">
                            <input type="radio" name="source" value="Production" checked>
                            <span class="pill-btn">🏭 Production</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="source" value="Achat">
                            <span class="pill-btn">🛒 Achat</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Qualité *</label>
                    <div class="radio-pill-group">
                        <label class="radio-pill">
                            <input type="radio" name="qualite" value="S1" checked>
                            <span class="pill-btn">⭐ S1</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="qualite" value="S2">
                            <span class="pill-btn">S2</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Row 2: Diamètre & Longueur -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-diam">Diamètre (mm) *</label>
                    <input type="number" step="any" id="f-diam" class="form-control" placeholder="Ex: 32" required>
                </div>
                <div class="form-group">
                    <label for="f-long">Longueur (m) *</label>
                    <input type="number" step="any" id="f-long" class="form-control" placeholder="Ex: 100" required>
                </div>
            </div>

            <!-- Row 3: Couleur & Poids -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-color">Couleur</label>
                    <input type="text" id="f-color" class="form-control" list="color-list" placeholder="Ex: Noir" value="Noir">
                    <datalist id="color-list">
                        <option value="Noir">
                        <option value="Bleu">
                        <option value="Blanc">
                        <option value="Rayé Bleu">
                        <option value="Vert">
                        <option value="Transparent">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="f-poids">Poids unitaire (Kg)</label>
                    <input type="number" step="0.01" id="f-poids" class="form-control" placeholder="Ex: 14.5">
                </div>
            </div>

            <!-- Row 4: Stock & Tarif -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-stock">Stock Initial *</label>
                    <input type="number" id="f-stock" class="form-control" placeholder="Ex: 50" required>
                </div>
                <div class="form-group">
                    <label for="f-price">Tarif HT (DH) *</label>
                    <input type="number" step="any" id="f-price" class="form-control" placeholder="Ex: 420" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Enregistrer le Produit</button>
        </form>
    </div>
</div>

<script>
    // ===== CONFIGURATION SUPABASE =====
    const SUPABASE_URL = 'https://jhzfnatsshpohnoswxcd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JBix_f2SunAeMawTs9Y4TQ_NjXLrmfa';

    async function supabase(method, path, body = null) {
        const options = {
            method: method,
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': method === 'POST' ? 'return=representation' : ''
            }
        };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, options);
        if (!res.ok) {
            const err = await res.text();
            throw new Error(err || `Erreur Supabase ${res.status}`);
        }
        const text = await res.text();
        return text ? JSON.parse(text) : [];
    }

    let itemsList = [];
    let currentFilter = 'all';
    let isLoading = false;

    // ===== CHARGEMENT DEPUIS SUPABASE =====
    async function loadItems() {
        isLoading = true;
        const container = document.getElementById('items-list');
        container.innerHTML = `
            <div style="text-align:center; padding:50px 20px; color:var(--text-muted);">
                <div style="font-size:32px; animation:spin 1s linear infinite; display:inline-block;">🔄</div>
                <p style="font-weight:700; font-size:13px; margin-top:8px;">Chargement des produits...</p>
            </div>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        `;

        try {
            const data = await supabase('GET', '/produits?select=*&order=id.asc');
            console.log('Données produits reçues de Supabase:', data);
            itemsList = Array.isArray(data) ? data : [];
            renderList();
            updateKPIs();
        } catch (error) {
            console.error('Erreur chargement Supabase:', error);
            container.innerHTML = `
                <div style="text-align:center; padding:40px 20px; color:#c1121f;">
                    <p style="font-size:28px;">⚠️</p>
                    <p style="font-weight:800; font-size:13px;">Erreur de connexion à Supabase</p>
                    <p style="font-size:11px; color:var(--text-muted); margin-top:4px;">${error.message}</p>
                    <button onclick="loadItems()" style="margin-top:10px; padding:6px 14px; border-radius:10px; border:none; background:var(--primary); color:white; font-size:11px; font-weight:700; cursor:pointer;">Réessayer</button>
                </div>
            `;
        } finally {
            isLoading = false;
        }
    }

    function renderList() {
        const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
        const container = document.getElementById('items-list');

        const filtered = itemsList.filter(item => {
            const searchStr = `${item.name || ''} ${item.cat || ''} ${item.diam || ''} ${item.long || ''} ${item.color || ''} ${item.qualite || ''} ${item.source || ''} ${item.dim || ''}`.toLowerCase();
            const matchSearch = searchStr.includes(searchVal);
            const matchFilter = currentFilter === 'all' || item.cat === currentFilter;
            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px 20px; color: var(--text-muted);">
                    <p style="font-size: 28px; margin-bottom: 6px;">📦</p>
                    <p style="font-weight: 700; font-size: 13px;">Aucun produit trouvé</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isLow = Number(item.stock) <= 20;
            const cardClass = isLow ? 'attente' : 'regle';
            const isAchat = (item.source || '').toLowerCase() === 'achat';
            const qual = item.qualite || 'S1';
            const catName = item.cat || 'Tuyaux PEHD';

            return `
                <div class="item-card ${cardClass}" onclick="openDetail(${item.id})">
                    <div class="avatar">${catName.substring(0, 2).toUpperCase()}</div>
                    <div class="card-content">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
                            <div class="item-name">${item.name}</div>
                            <span class="badge-source ${isAchat ? 'badge-achat' : 'badge-prod'}">
                                ${isAchat ? '🛒 Achat' : '🏭 Prod'}
                            </span>
                        </div>
                        <div class="item-meta-line" style="flex-wrap:wrap; gap:4px; margin-top:3px;">
                            <span class="cat-tag">${catName}</span>
                            <span class="tag-qualite tag-${qual.toLowerCase()}">${qual}</span>
                            ${item.diam && item.diam !== '-' ? `<span class="attr-pill">Ø${item.diam}</span>` : ''}
                            ${item.long && item.long !== '-' ? `<span class="attr-pill">L:${item.long}m</span>` : ''}
                            ${item.color ? `<span class="attr-pill">🎨 ${item.color}</span>` : ''}
                            ${item.poids && item.poids !== '-' ? `<span class="attr-pill">⚖️ ${item.poids}kg</span>` : ''}
                            ${isLow ? '<span class="tag-stock-low">Stock Bas</span>' : ''}
                        </div>
                        <div class="amount-row" style="margin-top:6px;">
                            <span class="amount">📦 ${Number(item.stock).toLocaleString('fr-FR')} ${item.unit || 'Unités'}</span>
                            <span class="price-badge">${Number(item.price).toLocaleString('fr-FR')} DH <span style="font-size:10px; color:var(--text-muted); font-weight:600;">HT</span></span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateKPIs() {
        document.getElementById('kpi-count').textContent = `${itemsList.length} références`;

        const totalStock = itemsList.reduce((s, p) => s + (Number(p.stock) || 0), 0);
        const totalVal = itemsList.reduce((s, p) => s + ((Number(p.stock) || 0) * (Number(p.price) || 0)), 0);
        const lowStockCount = itemsList.filter(p => Number(p.stock) <= 20).length;
        const inStockCount = itemsList.length - lowStockCount;

        document.getElementById('kpi-en-stock').textContent = `${inStockCount} réfs`;
        document.getElementById('kpi-stock-bas').textContent = `${lowStockCount} alertes`;
        document.getElementById('kpi-total-unites').textContent = `${totalStock.toLocaleString('fr-FR')}`;
        document.getElementById('highlight-valeur').textContent = `${totalVal.toLocaleString('fr-FR')} DH`;
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    // ===== ENREGISTREMENT NOUVEAU PRODUIT VERS SUPABASE =====
    document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.querySelector('#add-form .btn-submit');
        const origText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Enregistrement dans Supabase...";

        const diamVal = document.getElementById('f-diam').value.trim();
        const longVal = document.getElementById('f-long').value.trim();
        const colorVal = document.getElementById('f-color').value.trim() || 'Noir';
        const poidsVal = document.getElementById('f-poids').value.trim();
        const stockVal = parseInt(document.getElementById('f-stock').value) || 0;
        const priceVal = parseFloat(document.getElementById('f-price').value) || 0;

        const qualVal = document.querySelector('input[name="qualite"]:checked')?.value || 'S1';
        const sourceVal = document.querySelector('input[name="source"]:checked')?.value || 'Production';

        const nameVal = `Tuyau Ø${diamVal} L${longVal}m ${qualVal} ${colorVal}`;
        const statutVal = stockVal <= 20 ? 'Stock Faible' : 'En Stock';
        const unitVal = parseFloat(longVal) <= 12 ? 'Barres' : 'Couronnes';

        const newItem = {
            name: nameVal,
            cat: 'Tuyaux PEHD',
            diam: diamVal,
            long: parseFloat(longVal) || 0,
            qualite: qualVal,
            color: colorVal,
            poids: poidsVal ? parseFloat(poidsVal) : null,
            stock: stockVal,
            price: priceVal,
            source: sourceVal,
            unit: unitVal,
            statut: statutVal,
            dim: `Ø${diamVal}mm / L${longVal}m`
        };

        try {
            await supabase('POST', '/produits', newItem);
            document.getElementById('add-form').reset();
            document.querySelector('input[name="qualite"][value="S1"]').checked = true;
            document.querySelector('input[name="source"][value="Production"]').checked = true;
            closeAddModal();
            await loadItems();
        } catch (error) {
            alert("Erreur lors de l'enregistrement dans Supabase : " + error.message);
            console.error(error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = origText;
        }
    });

    // ===== DÉTAILS D'UN PRODUIT =====
    function openDetail(id) {
        const item = itemsList.find(x => Number(x.id) === Number(id));
        if (!item) return;

        document.getElementById('det-name').textContent = item.name;
        document.getElementById('det-cat').textContent = item.cat || 'Tuyaux PEHD';

        const isLow = Number(item.stock) <= 20;
        const pillClass = isLow ? 'pill-attente' : 'pill-regle';
        const isAchat = (item.source || '').toLowerCase() === 'achat';
        const qual = item.qualite || 'S1';

        const body = document.getElementById('detail-body');
        body.innerHTML = `
            <div class="info-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Tarif de Vente HT</span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <span class="badge-source ${isAchat ? 'badge-achat' : 'badge-prod'}">
                            ${isAchat ? '🛒 Achat' : '🏭 Production'}
                        </span>
                        <span class="status-pill ${pillClass}">${item.statut || (isLow ? 'Stock Bas' : 'En Stock')}</span>
                    </div>
                </div>
                <div style="font-family:'Outfit'; font-size:24px; font-weight:800; color:var(--amount-color); margin-top:4px;">
                    ${Number(item.price).toLocaleString('fr-FR')} <span style="font-size:13px; color:var(--text-main); font-weight:700;">DH / ${item.unit || 'Unité'}</span>
                </div>
            </div>

            <div class="info-card" style="font-size:12px; gap:8px;">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🏷️ Catégorie :</strong>
                    <span class="cat-tag">${item.cat || 'Tuyaux PEHD'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>⭐ Qualité :</strong>
                    <span class="tag-qualite tag-${qual.toLowerCase()}">${qual === 'S1' ? 'S1 — 1er Choix' : 'S2 — 2ème Choix'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📏 Diamètre :</strong>
                    <span style="font-weight:800; color:var(--text-main);">${item.diam && item.diam !== '-' ? 'Ø ' + item.diam + ' mm' : (item.dim || '-')}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📐 Longueur :</strong>
                    <span style="font-weight:800; color:var(--text-main);">${item.long && item.long !== '-' ? item.long + ' m' : '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🎨 Couleur :</strong>
                    <span style="font-weight:700;">${item.color || '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>⚖️ Poids :</strong>
                    <span style="font-weight:700;">${item.poids && item.poids !== '-' ? item.poids + ' kg' : '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🏭 Source :</strong>
                    <span style="font-weight:700;">${isAchat ? '🛒 Achat Fournisseur / Négoce' : '🏭 Fabrication Production Interne'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📦 Quantité en stock :</strong>
                    <span style="font-weight:800; color:var(--primary);">${Number(item.stock).toLocaleString('fr-FR')} ${item.unit || 'Unités'}</span>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <strong>💰 Valeur du stock :</strong>
                    <span style="font-weight:800; color:var(--page-accent);">${((Number(item.stock) || 0) * (Number(item.price) || 0)).toLocaleString('fr-FR')} DH</span>
                </div>
            </div>

            <div class="btn-action-row">
                <button onclick="ajusterStock(${item.id}, 1)" class="btn-action-sheet btn-in-stock">
                    📥 + Entrée Stock
                </button>
                <button onclick="ajusterStock(${item.id}, -1)" class="btn-action-sheet btn-out-stock">
                    📤 - Sortie Vente
                </button>
            </div>

            <button onclick="deleteItem(${item.id})" class="btn-delete-item">
                🗑️ Supprimer ce produit
            </button>
        `;

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    // ===== AJUSTEMENT DU STOCK DANS SUPABASE =====
    async function ajusterStock(id, dir) {
        const val = prompt(dir > 0 ? "Quantité entrée en stock (production / achat) :" : "Quantité sortie de stock (livraison / vente) :");
        if (!val || isNaN(val)) return;

        const delta = parseInt(val);
        if (delta <= 0) return;

        const item = itemsList.find(x => Number(x.id) === Number(id));
        if (!item) return;

        const newStock = Math.max(0, Number(item.stock) + (dir * delta));
        const newStatut = newStock <= 20 ? 'Stock Faible' : 'En Stock';

        try {
            await supabase('PATCH', `/produits?id=eq.${id}`, {
                stock: newStock,
                statut: newStatut
            });
            item.stock = newStock;
            item.statut = newStatut;
            renderList();
            updateKPIs();
            openDetail(id);
        } catch (error) {
            alert("Erreur lors de la mise à jour du stock : " + error.message);
        }
    }

    // ===== SUPPRESSION D'UN PRODUIT DANS SUPABASE =====
    async function deleteItem(id) {
        if (!confirm("Confirmer la suppression définitive de ce produit ?")) return;

        try {
            await supabase('DELETE', `/produits?id=eq.${id}`);
            itemsList = itemsList.filter(x => Number(x.id) !== Number(id));
            renderList();
            updateKPIs();
            closeDetail();
        } catch (error) {
            alert("Erreur lors de la suppression : " + error.message);
        }
    }

    // Filtres & Recherche
    document.getElementById('search-input').addEventListener('input', renderList);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderList();
        });
    });

    // Fermeture des modales au clic sur l'arrière-plan
    [document.getElementById('add-modal'), document.getElementById('detail-modal')].forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

    // Chargement initial depuis Supabase
    loadItems();
</script>
</body>
</html>

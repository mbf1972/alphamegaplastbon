<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#78350f">
    <title>Produits Finis — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Produits : Ambre Chaud, Or Industriel & Terre Cuite */
            --primary: #d97706;
            --primary-dark: #78350f;
            --primary-light: #f59e0b;
            --primary-soft: #fbbf24;
            --primary-subtle: #fffbeb;

            --accent: #15803d;
            --accent-deep: #166534;
            --accent-soft: #dcfce7;

            --bg-body: #fbf3e6;
            --bg-app: #fdfaf5;
            --card-bg: #ffffff;

            --text-main: #261607;
            --text-muted: #785a3c;
            --text-dim: #a6896c;
            --amount-color: #d97706;
            --line: rgba(217, 119, 6, 0.12);

            --status-regle: #15803d;
            --status-regle-bg: #dcfce7;
            --status-echu: #dc2626;
            --status-echu-bg: #fee2e2;
            --status-attente: #d97706;
            --status-attente-bg: #fef3c7;

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 90% 0%, rgba(251, 191, 36, 0.30), transparent 65%),
                radial-gradient(ellipse 45% 40% at 0% 100%, rgba(217, 119, 6, 0.18), transparent 60%);
            pointer-events: none; z-index: 0;
        }

        button { font: inherit; }
        :focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #fefdfb 0%, #f7f1e6 100%);
            box-shadow: 0 24px 70px rgba(120, 53, 15, 0.16), 0 0 0 1px rgba(217, 119, 6, 0.08);
        }

        /* ===== HEADER ===== */
        .app-header {
            position: relative;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 52px;
            color: #fff;
            background:
                radial-gradient(circle at 90% -10%, rgba(251, 191, 36, 0.45), transparent 50%),
                radial-gradient(circle at 0% 120%, rgba(217, 119, 6, 0.32), transparent 45%),
                linear-gradient(155deg, #78350f 0%, #b45309 55%, #d97706 100%);
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        .app-header::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.3px);
            background-size: 16px 16px;
            -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            pointer-events: none;
        }

        .header-top {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .back-btn {
            width: 40px; height: 40px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 14px; color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s var(--ease), background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.26); transform: translateX(-2px); }
        .back-btn:active { transform: scale(0.92); }

        .brand-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px;
            color: #fde68a; text-transform: uppercase;
        }
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1;
        }

        .header-actions { display: flex; align-items: center; }
        .btn-new {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px; border: 0; border-radius: 14px; cursor: pointer;
            font-size: 12.5px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 6px 18px rgba(22, 101, 52, 0.40);
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
        }
        .btn-new:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(22, 101, 52, 0.50); }
        .btn-new:active { transform: scale(0.95); }

        /* Carte valeur totale (chevauche le header) */
        .total-solde {
            position: relative; z-index: 6;
            margin: -30px 16px 0;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: #fff; border-radius: 22px;
            box-shadow: 0 14px 32px -8px rgba(120, 53, 15, 0.22), 0 0 0 1px var(--line);
        }
        .total-label {
            display: block;
            font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--text-muted);
        }
        .total-amount {
            display: block; margin-top: 2px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 800; letter-spacing: -0.6px;
            color: var(--primary);
        }
        .total-badge {
            flex-shrink: 0;
            padding: 7px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 800; white-space: nowrap;
            color: var(--primary-dark); background: #fef3c7; border: 1px solid #fde68a;
        }

        /* ===== TOOLBAR COLLANTE (SEARCH + FILTERS) ===== */
        .toolbar {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 16px 10px;
            background: rgba(253, 250, 245, 0.90);
            backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        }
        .search-container { position: relative; margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 13px 16px 13px 44px;
            font-size: 13.5px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
            box-shadow: 0 4px 14px -6px rgba(120, 53, 15, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input::placeholder { color: var(--text-dim); font-weight: 600; }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.16); }
        .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.55; pointer-events: none;
        }

        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex-shrink: 0; white-space: nowrap;
            padding: 8px 15px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer;
            font-size: 12px; font-weight: 800; color: var(--text-muted); background: #fff;
            transition: all 0.2s var(--ease);
        }
        .tab-btn:hover { border-color: rgba(217, 119, 6, 0.5); color: var(--primary); }
        .tab-btn.active {
            color: #fff; border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 6px 14px -4px rgba(217, 119, 6, 0.45);
        }

        /* ===== STATS ===== */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 16px 4px; }
        .stat-card {
            position: relative; overflow: hidden;
            padding: 10px 12px 10px; border-radius: 16px;
            background: #fff; border: 1px solid var(--line);
            box-shadow: 0 4px 14px -8px rgba(120, 53, 15, 0.10);
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--c, var(--primary-soft));
        }
        .stat-card.s-regle   { --c: var(--status-regle); }
        .stat-card.s-echu    { --c: var(--status-echu); }
        .stat-card.s-attente { --c: var(--status-attente); }
        .stat-label {
            display: flex; align-items: center; gap: 5px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            color: var(--c); margin-bottom: 3px;
        }
        .stat-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .stat-val {
            display: block; font-family: 'Outfit', sans-serif;
            font-size: 12.5px; font-weight: 800; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== LISTE PRODUITS ===== */
        .items-list { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 8px; }

        .item-card {
            position: relative; overflow: hidden; cursor: pointer;
            display: flex; align-items: center; gap: 13px;
            padding: 13px 14px 13px 18px;
            background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px;
            box-shadow: 0 6px 18px -8px rgba(120, 53, 15, 0.10), 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
            animation: cardIn 0.45s var(--ease) both;
        }
        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(217, 119, 6, 0.4);
            box-shadow: 0 16px 30px -10px rgba(120, 53, 15, 0.18);
        }
        .item-card:active { transform: scale(0.98); transition-duration: 0.08s; }
        .item-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--status-c); }
        .item-card.regle   { --status-c: var(--status-regle); }
        .item-card.attente { --status-c: var(--status-attente); }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        .avatar {
            position: relative; flex-shrink: 0;
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center;
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: #fff;
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
            box-shadow: 0 8px 16px -6px rgba(217, 119, 6, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .avatar::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
            pointer-events: none;
        }

        .card-content { flex: 1; min-width: 0; }
        .item-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-meta-line {
            display: flex; align-items: center; gap: 6px; margin-top: 2px;
            font-size: 11px; font-weight: 700; color: var(--text-dim);
            flex-wrap: wrap;
        }

        .cat-tag {
            background: #fffbeb; color: var(--primary);
            padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
        }
        .badge-source {
            font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
        }
        .badge-prod { background: #dcfce7; color: #166534; }
        .badge-achat { background: #fef3c7; color: #b45309; }

        .tag-qualite {
            font-size: 9.5px; font-weight: 800; padding: 2px 6px; border-radius: 6px;
        }
        .tag-s1 { background: #fef9c3; color: #854d0e; }
        .tag-s2 { background: #f1f5f9; color: #475569; }

        .attr-pill {
            background: #f8fafc; color: #64748b; border: 1px solid #e2e8f0;
            padding: 1.5px 6px; border-radius: 5px; font-size: 9.5px; font-weight: 700;
        }
        .tag-stock-low {
            background: #fee2e2; color: #dc2626;
            padding: 2px 6px; border-radius: 6px; font-size: 9.5px; font-weight: 800;
        }

        .amount-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
        .amount {
            font-family: 'Outfit', sans-serif; font-size: 15.5px; font-weight: 800; letter-spacing: -0.3px;
            color: var(--status-c);
        }
        .price-badge {
            font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 800;
            color: var(--text-muted); background: #fffbeb; border: 1px solid #fde68a;
            padding: 2px 8px; border-radius: 8px;
        }

        .status-pill {
            padding: 4px 10px; border-radius: 999px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
        }
        .pill-regle   { background: var(--status-regle-bg);   color: var(--status-regle); }
        .pill-attente { background: var(--status-attente-bg); color: var(--status-attente); }

        .empty-state {
            text-align: center; padding: 44px 20px; color: var(--text-muted);
            font-size: 13px; font-weight: 700;
        }
        .empty-icon { font-size: 34px; margin-bottom: 8px; }
        .empty-title { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .empty-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
        .btn-empty {
            padding: 9px 18px; border-radius: 12px; border: 0; cursor: pointer;
            font-size: 12px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .eco-footer {
            margin-top: auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
            text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }

        /* ===== MODAL DETAIL PRODUIT (BOTTOM SHEET) ===== */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            background: rgba(120, 53, 15, 0.55);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            width: 100%; max-width: 440px; max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-app);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -16px 50px rgba(0,0,0,0.28);
            animation: slideUp 0.35s var(--ease);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

        .modal-header {
            position: relative; flex-shrink: 0; overflow: hidden;
            padding: 22px 20px 18px; color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(251, 191, 36, 0.40), transparent 55%),
                radial-gradient(circle at 0% 120%, rgba(217, 119, 6, 0.30), transparent 50%),
                linear-gradient(155deg, #78350f, #b45309 60%, #d97706);
        }
        .modal-header::before {
            content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.35);
        }
        .modal-close {
            position: absolute; top: 16px; right: 14px;
            width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
            display: grid; place-items: center; cursor: pointer;
            font-size: 20px; line-height: 1; color: #fff; background: rgba(255,255,255,0.16);
            transition: background 0.2s, transform 0.2s var(--ease);
        }
        .modal-close:hover { background: rgba(217, 119, 6, 0.5); transform: rotate(90deg); }
        .modal-title {
            padding-right: 44px; margin-top: 6px;
            font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2;
        }
        .modal-subtitle { margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #fde68a; }

        .modal-body {
            padding: 16px 18px 28px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .info-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 4px 14px -6px rgba(120, 53, 15, 0.08);
            border: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 8px;
        }

        .btn-action-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .btn-action-sheet {
            padding: 12px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
            text-align: center; text-decoration: none; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s var(--ease);
        }
        .btn-action-sheet:active { transform: scale(0.96); }

        .btn-in-stock {
            background: #ecfdf5; color: #047857;
            border: 1.5px solid #a7f3d0;
        }
        .btn-in-stock:hover { background: #d1fae5; }

        .btn-out-stock {
            background: #fff7ed; color: #c2410c;
            border: 1.5px solid #fed7aa;
        }
        .btn-out-stock:hover { background: #ffedd5; }

        .btn-delete-item {
            background: #fff1f2; color: #be123c; border: 1px solid #fecdd3;
            padding: 11px; border-radius: 12px; font-size: 12px; font-weight: 800;
            cursor: pointer; margin-top: 4px; transition: all 0.15s;
        }
        .btn-delete-item:hover { background: #ffe4e6; }

        /* ===== MODAL NOUVEAU PRODUIT ===== */
        .radio-pill-group {
            display: flex; gap: 6px; height: 34px; margin-top: 2px;
        }
        .radio-pill {
            flex: 1; display: flex; position: relative; cursor: pointer; margin: 0;
        }
        .radio-pill input {
            position: absolute; opacity: 0; pointer-events: none;
        }
        .radio-pill .pill-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 10px; border: 1.5px solid #cbd5e1; background: #fff;
            font-size: 11.5px; font-weight: 800; color: var(--text-muted);
            transition: all 0.15s ease; user-select: none;
        }
        .radio-pill input:checked + .pill-btn {
            border-color: var(--primary); background: #fffbeb; color: var(--primary);
            box-shadow: 0 1px 4px rgba(217, 119, 6, 0.2);
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
        .form-group label { font-size: 11.5px; font-weight: 800; color: #374151; }
        .form-control {
            width: 100%; padding: 11px 13px; outline: none;
            font-size: 13px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid #cbd5e1; border-radius: 12px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-submit {
            padding: 13px 18px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-size: 13.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35);
            transition: all 0.2s; margin-top: 6px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(217, 119, 6, 0.45); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn" title="Retour au Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="brand-meta">
                    <div class="brand-name">CATALOGUE &amp; STOCK</div>
                    <div class="header-title">Produits Finis</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick="openAddModal()">+ Nouveau</button>
            </div>
        </div>
    </header>

    <!-- Carte Valeur Totale Stock (chevauchement) -->
    <div class="total-solde">
        <div>
            <span class="total-label">📦 Valeur Totale du Stock</span>
            <span class="total-amount" id="highlight-valeur">0 DH</span>
        </div>
        <div class="total-badge" id="kpi-count">0 référence</div>
    </div>

    <!-- Toolbar sticky (Recherche + Filtres) -->
    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher produit, diamètre, norme..." autocomplete="off">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Tous</button>
            <button class="tab-btn" data-filter="Tuyaux PEHD">Tuyaux PEHD</button>
            <button class="tab-btn" data-filter="Irrigation">Irrigation</button>
            <button class="tab-btn" data-filter="Film Agricole">Film Agricole</button>
            <button class="tab-btn" data-filter="Gaine Industrielle">Gaines</button>
        </div>
    </div>

    <!-- Mini stats bar -->
    <div class="stats-bar">
        <div class="stat-card s-regle">
            <span class="stat-label">En Stock</span>
            <span class="stat-val" id="kpi-en-stock">-</span>
        </div>
        <div class="stat-card s-attente">
            <span class="stat-label">Stock Bas</span>
            <span class="stat-val" id="kpi-stock-bas">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="--c: var(--primary);">Unités Total</span>
            <span class="stat-val" id="kpi-total-unites">-</span>
        </div>
    </div>

    <!-- Items Cards Grid -->
    <div class="items-list" id="items-list"></div>

    <div class="eco-footer">🌿 AMplast • Catalogue &amp; Produits Industriels</div>
</div>

<!-- ===== MODAL DETAIL PRODUIT (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeDetail()">×</button>
            <div class="modal-title" id="det-name">Produit</div>
            <div class="modal-subtitle" id="det-cat">Catégorie</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- Content injected dynamically -->
        </div>
    </div>
</div>

<!-- ===== MODAL NOUVEAU PRODUIT (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <div class="modal-title">Nouveau Produit Fini</div>
            <div class="modal-subtitle">Catalogue &amp; Gestion Stock AMplast</div>
        </div>
        <form id="add-form" class="modal-body">
            <!-- Row 1: Source & Qualité (Option buttons S1 / S2) -->
            <div class="form-row">
                <div class="form-group">
                    <label>Source *</label>
                    <div class="radio-pill-group">
                        <label class="radio-pill">
                            <input type="radio" name="source" value="Production" checked>
                            <span class="pill-btn">🏭 Production</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="source" value="Achat">
                            <span class="pill-btn">🛒 Achat</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Qualité *</label>
                    <div class="radio-pill-group">
                        <label class="radio-pill">
                            <input type="radio" name="qualite" value="S1" checked>
                            <span class="pill-btn">⭐ S1</span>
                        </label>
                        <label class="radio-pill">
                            <input type="radio" name="qualite" value="S2">
                            <span class="pill-btn">S2</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Row 2: Diamètre & Longueur -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-diam">Diamètre (mm) *</label>
                    <input type="number" step="any" id="f-diam" class="form-control" placeholder="Ex: 32" required>
                </div>
                <div class="form-group">
                    <label for="f-long">Longueur (m) *</label>
                    <input type="number" step="any" id="f-long" class="form-control" placeholder="Ex: 100" required>
                </div>
            </div>

            <!-- Row 3: Couleur & Poids -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-color">Couleur</label>
                    <input type="text" id="f-color" class="form-control" list="color-list" placeholder="Ex: Noir" value="Noir">
                    <datalist id="color-list">
                        <option value="Noir">
                        <option value="Bleu">
                        <option value="Blanc">
                        <option value="Rayé Bleu">
                        <option value="Vert">
                        <option value="Transparent">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="f-poids">Poids unitaire (Kg)</label>
                    <input type="number" step="0.01" id="f-poids" class="form-control" placeholder="Ex: 14.5">
                </div>
            </div>

            <!-- Row 4: Stock & Tarif -->
            <div class="form-row">
                <div class="form-group">
                    <label for="f-stock">Stock Initial *</label>
                    <input type="number" id="f-stock" class="form-control" placeholder="Ex: 50" required>
                </div>
                <div class="form-group">
                    <label for="f-price">Tarif HT (DH) *</label>
                    <input type="number" step="any" id="f-price" class="form-control" placeholder="Ex: 420" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Enregistrer le Produit</button>
        </form>
    </div>
</div>

<script>
    // ===== CONFIGURATION SUPABASE =====
    const SUPABASE_URL = 'https://jhzfnatsshpohnoswxcd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_JBix_f2SunAeMawTs9Y4TQ_NjXLrmfa';

    async function supabase(method, path, body = null) {
        const options = {
            method: method,
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': method === 'POST' ? 'return=representation' : ''
            }
        };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, options);
        if (!res.ok) {
            const err = await res.text();
            throw new Error(err || `Erreur Supabase ${res.status}`);
        }
        const text = await res.text();
        return text ? JSON.parse(text) : [];
    }

    let itemsList = [];
    let currentFilter = 'all';
    let isLoading = false;

    // ===== CHARGEMENT DEPUIS SUPABASE =====
    async function loadItems() {
        isLoading = true;
        const container = document.getElementById('items-list');
        container.innerHTML = `
            <div style="text-align:center; padding:50px 20px; color:var(--text-muted);">
                <div style="font-size:32px; animation:spin 1s linear infinite; display:inline-block;">🔄</div>
                <p style="font-weight:700; font-size:13px; margin-top:8px;">Chargement des produits...</p>
            </div>
            <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
        `;

        try {
            const data = await supabase('GET', '/produits?select=*&order=id.asc');
            itemsList = Array.isArray(data) ? data : [];
            renderList();
            updateKPIs();
        } catch (error) {
            console.error('Erreur chargement Supabase:', error);
            container.innerHTML = `
                <div style="text-align:center; padding:40px 20px; color:#c1121f;">
                    <p style="font-size:28px;">⚠️</p>
                    <p style="font-weight:800; font-size:13px;">Erreur de connexion à Supabase</p>
                    <p style="font-size:11px; color:var(--text-muted); margin-top:4px;">${error.message}</p>
                    <button onclick="loadItems()" style="margin-top:10px; padding:6px 14px; border-radius:10px; border:none; background:var(--primary); color:white; font-size:11px; font-weight:700; cursor:pointer;">Réessayer</button>
                </div>
            `;
        } finally {
            isLoading = false;
        }
    }

    function renderList() {
        const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
        const container = document.getElementById('items-list');

        const filtered = itemsList.filter(item => {
            const searchStr = `${item.name || ''} ${item.cat || ''} ${item.diam || ''} ${item.long || ''} ${item.color || ''} ${item.qualite || ''} ${item.source || ''} ${item.dim || ''}`.toLowerCase();
            const matchSearch = searchStr.includes(searchVal);
            const matchFilter = currentFilter === 'all' || item.cat === currentFilter;
            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📦</div>
                    <div class="empty-title">Aucun produit trouvé</div>
                    <div class="empty-sub">Modifiez votre recherche ou ajoutez une référence.</div>
                    <button class="btn-empty" onclick="openAddModal()">+ Nouveau produit</button>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isLow = Number(item.stock) <= 20;
            const cardClass = isLow ? 'attente' : 'regle';
            const isAchat = (item.source || '').toLowerCase() === 'achat';
            const qual = item.qualite || 'S1';
            const catName = item.cat || 'Tuyaux PEHD';

            return `
                <div class="item-card ${cardClass}" onclick="openDetail(${item.id})">
                    <div class="avatar">${catName.substring(0, 2).toUpperCase()}</div>
                    <div class="card-content">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px;">
                            <div class="item-name">${item.name}</div>
                            <span class="badge-source ${isAchat ? 'badge-achat' : 'badge-prod'}">
                                ${isAchat ? '🛒 Achat' : '🏭 Prod'}
                            </span>
                        </div>
                        <div class="item-meta-line" style="flex-wrap:wrap; gap:4px; margin-top:3px;">
                            <span class="cat-tag">${catName}</span>
                            <span class="tag-qualite tag-${qual.toLowerCase()}">${qual}</span>
                            ${item.diam && item.diam !== '-' ? `<span class="attr-pill">Ø${item.diam}</span>` : ''}
                            ${item.long && item.long !== '-' ? `<span class="attr-pill">L:${item.long}m</span>` : ''}
                            ${item.color ? `<span class="attr-pill">🎨 ${item.color}</span>` : ''}
                            ${item.poids && item.poids !== '-' ? `<span class="attr-pill">⚖️ ${item.poids}kg</span>` : ''}
                            ${isLow ? '<span class="tag-stock-low">Stock Bas</span>' : ''}
                        </div>
                        <div class="amount-row" style="margin-top:6px;">
                            <span class="amount">📦 ${Number(item.stock).toLocaleString('fr-FR')} ${item.unit || 'Unités'}</span>
                            <span class="price-badge">${Number(item.price).toLocaleString('fr-FR')} DH <span style="font-size:10px; color:var(--text-muted); font-weight:600;">HT</span></span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateKPIs() {
        document.getElementById('kpi-count').textContent = `${itemsList.length} références`;

        const totalStock = itemsList.reduce((s, p) => s + (Number(p.stock) || 0), 0);
        const totalVal = itemsList.reduce((s, p) => s + ((Number(p.stock) || 0) * (Number(p.price) || 0)), 0);
        const lowStockCount = itemsList.filter(p => Number(p.stock) <= 20).length;
        const inStockCount = itemsList.length - lowStockCount;

        document.getElementById('kpi-en-stock').textContent = `${inStockCount} réfs`;
        document.getElementById('kpi-stock-bas').textContent = `${lowStockCount} alertes`;
        document.getElementById('kpi-total-unites').textContent = `${totalStock.toLocaleString('fr-FR')}`;
        document.getElementById('highlight-valeur').textContent = `${totalVal.toLocaleString('fr-FR')} DH`;
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    // ===== ENREGISTREMENT NOUVEAU PRODUIT VERS SUPABASE =====
    document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.querySelector('#add-form .btn-submit');
        const origText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Enregistrement dans Supabase...";

        const diamVal = document.getElementById('f-diam').value.trim();
        const longVal = document.getElementById('f-long').value.trim();
        const colorVal = document.getElementById('f-color').value.trim() || 'Noir';
        const poidsVal = document.getElementById('f-poids').value.trim();
        const stockVal = parseInt(document.getElementById('f-stock').value) || 0;
        const priceVal = parseFloat(document.getElementById('f-price').value) || 0;

        const qualVal = document.querySelector('input[name="qualite"]:checked')?.value || 'S1';
        const sourceVal = document.querySelector('input[name="source"]:checked')?.value || 'Production';

        const nameVal = `Tuyau Ø${diamVal} L${longVal}m ${qualVal} ${colorVal}`;
        const statutVal = stockVal <= 20 ? 'Stock Faible' : 'En Stock';
        const unitVal = parseFloat(longVal) <= 12 ? 'Barres' : 'Couronnes';

        const newItem = {
            name: nameVal,
            cat: 'Tuyaux PEHD',
            diam: diamVal,
            long: parseFloat(longVal) || 0,
            qualite: qualVal,
            color: colorVal,
            poids: poidsVal ? parseFloat(poidsVal) : null,
            stock: stockVal,
            price: priceVal,
            source: sourceVal,
            unit: unitVal,
            statut: statutVal,
            dim: `Ø${diamVal}mm / L${longVal}m`
        };

        try {
            await supabase('POST', '/produits', newItem);
            document.getElementById('add-form').reset();
            document.querySelector('input[name="qualite"][value="S1"]').checked = true;
            document.querySelector('input[name="source"][value="Production"]').checked = true;
            closeAddModal();
            await loadItems();
        } catch (error) {
            alert("Erreur lors de l'enregistrement dans Supabase : " + error.message);
            console.error(error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = origText;
        }
    });

    // ===== DÉTAILS D'UN PRODUIT =====
    function openDetail(id) {
        const item = itemsList.find(x => Number(x.id) === Number(id));
        if (!item) return;

        document.getElementById('det-name').textContent = item.name;
        document.getElementById('det-cat').textContent = item.cat || 'Tuyaux PEHD';

        const isLow = Number(item.stock) <= 20;
        const pillClass = isLow ? 'pill-attente' : 'pill-regle';
        const isAchat = (item.source || '').toLowerCase() === 'achat';
        const qual = item.qualite || 'S1';

        const body = document.getElementById('detail-body');
        body.innerHTML = `
            <div class="info-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Tarif de Vente HT</span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <span class="badge-source ${isAchat ? 'badge-achat' : 'badge-prod'}">
                            ${isAchat ? '🛒 Achat' : '🏭 Production'}
                        </span>
                        <span class="status-pill ${pillClass}">${item.statut || (isLow ? 'Stock Bas' : 'En Stock')}</span>
                    </div>
                </div>
                <div style="font-family:'Outfit'; font-size:24px; font-weight:800; color:var(--amount-color); margin-top:4px;">
                    ${Number(item.price).toLocaleString('fr-FR')} <span style="font-size:13px; color:var(--text-main); font-weight:700;">DH / ${item.unit || 'Unité'}</span>
                </div>
            </div>

            <div class="info-card" style="font-size:12px; gap:8px;">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🏷️ Catégorie :</strong>
                    <span class="cat-tag">${item.cat || 'Tuyaux PEHD'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>⭐ Qualité :</strong>
                    <span class="tag-qualite tag-${qual.toLowerCase()}">${qual === 'S1' ? 'S1 — 1er Choix' : 'S2 — 2ème Choix'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📏 Diamètre :</strong>
                    <span style="font-weight:800; color:var(--text-main);">${item.diam && item.diam !== '-' ? 'Ø ' + item.diam + ' mm' : (item.dim || '-')}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📐 Longueur :</strong>
                    <span style="font-weight:800; color:var(--text-main);">${item.long && item.long !== '-' ? item.long + ' m' : '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🎨 Couleur :</strong>
                    <span style="font-weight:700;">${item.color || '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>⚖️ Poids :</strong>
                    <span style="font-weight:700;">${item.poids && item.poids !== '-' ? item.poids + ' kg' : '-'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>🏭 Source :</strong>
                    <span style="font-weight:700;">${isAchat ? '🛒 Achat Fournisseur / Négoce' : '🏭 Fabrication Production Interne'}</span>
                </div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f3f4f6; padding-bottom:5px;">
                    <strong>📦 Quantité en stock :</strong>
                    <span style="font-weight:800; color:var(--primary);">${Number(item.stock).toLocaleString('fr-FR')} ${item.unit || 'Unités'}</span>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <strong>💰 Valeur du stock :</strong>
                    <span style="font-weight:800; color:var(--primary-dark);">${((Number(item.stock) || 0) * (Number(item.price) || 0)).toLocaleString('fr-FR')} DH</span>
                </div>
            </div>

            <div class="btn-action-row">
                <button onclick="ajusterStock(${item.id}, 1)" class="btn-action-sheet btn-in-stock">
                    📥 + Entrée Stock
                </button>
                <button onclick="ajusterStock(${item.id}, -1)" class="btn-action-sheet btn-out-stock">
                    📤 - Sortie Vente
                </button>
            </div>

            <button onclick="deleteItem(${item.id})" class="btn-delete-item">
                🗑️ Supprimer ce produit
            </button>
        `;

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    // ===== AJUSTEMENT DU STOCK DANS SUPABASE =====
    async function ajusterStock(id, dir) {
        const val = prompt(dir > 0 ? "Quantité entrée en stock (production / achat) :" : "Quantité sortie de stock (livraison / vente) :");
        if (!val || isNaN(val)) return;

        const delta = parseInt(val);
        if (delta <= 0) return;

        const item = itemsList.find(x => Number(x.id) === Number(id));
        if (!item) return;

        const newStock = Math.max(0, Number(item.stock) + (dir * delta));
        const newStatut = newStock <= 20 ? 'Stock Faible' : 'En Stock';

        try {
            await supabase('PATCH', `/produits?id=eq.${id}`, {
                stock: newStock,
                statut: newStatut
            });
            item.stock = newStock;
            item.statut = newStatut;
            renderList();
            updateKPIs();
            openDetail(id);
        } catch (error) {
            alert("Erreur lors de la mise à jour du stock : " + error.message);
        }
    }

    // ===== SUPPRESSION D'UN PRODUIT DANS SUPABASE =====
    async function deleteItem(id) {
        if (!confirm("Confirmer la suppression définitive de ce produit ?")) return;

        try {
            await supabase('DELETE', `/produits?id=eq.${id}`);
            itemsList = itemsList.filter(x => Number(x.id) !== Number(id));
            renderList();
            updateKPIs();
            closeDetail();
        } catch (error) {
            alert("Erreur lors de la suppression : " + error.message);
        }
    }

    // Filtres & Recherche
    document.getElementById('search-input').addEventListener('input', renderList);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderList();
        });
    });

    // Fermeture des modales au clic sur l'arrière-plan
    [document.getElementById('add-modal'), document.getElementById('detail-modal')].forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

    // Chargement initial depuis Supabase
    loadItems();
</script>
</body>
</html>

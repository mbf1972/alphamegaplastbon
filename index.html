<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Menu Principal — AMplast Système de Gestion">
    <meta name="theme-color" content="#0f4630">
    <title>Menu Principal — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Évite le flash de l'écran de verrouillage si la session est déjà ouverte -->
    <script>
        try {
            var d = JSON.parse(localStorage.getItem('auth_data') || '{}');
            if (d.passed === 'true' && (Date.now() - d.time < 12 * 3600 * 1000)) {
                document.documentElement.classList.add('authed');
            }
        } catch (e) {}
    </script>

    <style>
        :root {
            --green-900: #0b3322;
            --green-800: #0f4630;
            --green-700: #15573a;
            --green-600: #1e7550;
            --green-400: #4ade80;
            --green-100: #dcf3e6;
            --green-50:  #f1faf5;

            --orange-500: #f97316;
            --orange-600: #ea580c;
            --orange-100: #ffedd5;

            --bg:        #eaf4ee;
            --surface:   #ffffff;
            --ink:       #0e261a;
            --ink-soft:  #4d735f;
            --ink-dim:   #86a595;
            --line:      rgba(21, 87, 58, 0.10);

            --radius-card: 22px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: stretch;
            position: relative;
        }

        /* Fond d'ambiance (visible surtout sur grand écran) */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 90% 0%,   rgba(74, 222, 128, 0.30), transparent 65%),
                radial-gradient(ellipse 45% 40% at 0% 100%,  rgba(249, 115, 22, 0.16), transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 115%, rgba(134, 239, 172, 0.28), transparent 65%);
            pointer-events: none;
            z-index: 0;
        }

        button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

        :focus-visible {
            outline: 3px solid var(--orange-500);
            outline-offset: 3px;
        }

        /* ===== CONTENEUR ===== */
        .app {
            position: relative; z-index: 1;
            width: 100%; max-width: 480px;
            height: 100dvh;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #f6fbf8 0%, #eef7f2 100%);
            box-shadow: 0 24px 70px rgba(11, 51, 34, 0.14), 0 0 0 1px rgba(21, 87, 58, 0.06);
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            position: relative;
            flex-shrink: 0;
            padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 54px;
            color: #fff;
            background:
                radial-gradient(circle at 88% -10%, rgba(74, 222, 128, 0.35), transparent 50%),
                radial-gradient(circle at 5% 120%,  rgba(249, 115, 22, 0.30), transparent 45%),
                linear-gradient(155deg, var(--green-900) 0%, var(--green-700) 55%, var(--green-600) 100%);
            border-radius: 0 0 36px 36px;
            overflow: hidden;
        }

        /* Motif discret de points */
        .header::before {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.10) 1px, transparent 1.3px);
            background-size: 16px 16px;
            mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            pointer-events: none;
        }

        .header-row {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }

        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .logo {
            width: 50px; height: 50px; flex-shrink: 0;
            background: #fff;
            border-radius: 16px;
            padding: 6px;
            display: grid; place-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.22), 0 0 0 2px rgba(249, 115, 22, 0.45);
            overflow: hidden;
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; }

        .brand-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            color: #a7f3d0;
        }
        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 19px; font-weight: 800; letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .btn-lock {
            width: 40px; height: 40px; flex-shrink: 0;
            border-radius: 14px;
            display: grid; place-items: center;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.2s var(--ease), border-color 0.2s;
        }
        .btn-lock:hover { background: rgba(249,115,22,0.40); border-color: rgba(249,115,22,0.7); transform: scale(1.06); }
        .btn-lock:active { transform: scale(0.92); }
        .btn-lock svg { width: 18px; height: 18px; }

        .greeting {
            position: relative; z-index: 1;
            margin-top: 22px;
        }
        .greeting-hello {
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 800; letter-spacing: -0.6px;
            line-height: 1.1;
        }
        .greeting-date {
            margin-top: 5px;
            font-size: 13px; font-weight: 700;
            color: #c9f5dc;
        }

        /* ===== BANDEAU STATUT (chevauche le header) ===== */
        .status {
            position: relative; z-index: 6;
            flex-shrink: 0;
            margin: -28px 18px 0;
            background: var(--surface);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 10px 28px -6px rgba(11, 51, 34, 0.20), 0 0 0 1px var(--line);
        }
        .status-left { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; color: var(--green-800); }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.20);
            animation: pulse 2.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.25);} 50% { box-shadow: 0 0 0 7px rgba(34,197,94,0.06);} }
        .status-version {
            font-size: 10.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, var(--orange-500), var(--orange-600));
            padding: 4px 10px; border-radius: 10px;
            box-shadow: 0 3px 10px rgba(234, 88, 12, 0.35);
        }

        /* ===== TITRE DE SECTION ===== */
        .section {
            flex-shrink: 0;
            display: flex; align-items: center; gap: 10px;
            padding: 16px 22px 8px;
        }
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 12px; font-weight: 800;
            letter-spacing: 2.2px; text-transform: uppercase;
            color: var(--green-800);
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: var(--orange-500);
            box-shadow: 0 0 0 3px rgba(249,115,22,0.18);
        }
        .section-line {
            flex: 1; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, rgba(46,163,113,0.35), rgba(249,115,22,0.28), transparent);
        }

        /* ===== GRILLE ===== */
        .main {
            flex: 1; min-height: 0;
            padding: 4px 16px 6px;
            display: flex;
        }
        .grid {
            flex: 1; min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
        }

        .card {
            --c: 16, 149, 93;
            --c2: 46, 163, 113;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 9px;
            padding: 10px 4px;
            border-radius: var(--radius-card);
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
            overflow: hidden;
            user-select: none;
            box-shadow: 0 6px 18px -6px rgba(11, 51, 34, 0.12), 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
            animation: cardIn 0.5s var(--ease) both;
        }
        /* Liseré coloré en bas */
        .card::after {
            content: '';
            position: absolute; left: 22%; right: 22%; bottom: 0;
            height: 3px; border-radius: 3px 3px 0 0;
            background: linear-gradient(90deg, rgb(var(--c)), rgb(var(--c2)));
            opacity: 0.55;
            transition: left 0.25s var(--ease), right 0.25s var(--ease), opacity 0.25s;
        }
        /* Lueur douce en haut */
        .card::before {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(120% 70% at 50% 0%, rgba(var(--c), 0.09), transparent 70%);
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(var(--c), 0.40);
            box-shadow: 0 16px 30px -8px rgba(var(--c), 0.34), 0 2px 6px rgba(0,0,0,0.04);
        }
        .card:hover::after { left: 0; right: 0; opacity: 1; }
        .card:active { transform: translateY(1px) scale(0.97); transition-duration: 0.08s; }

        .icon {
            position: relative; z-index: 1;
            width: 50px; height: 50px;
            border-radius: 17px;
            display: grid; place-items: center;
            color: #fff;
            background: linear-gradient(145deg, rgb(var(--c2)) 0%, rgb(var(--c)) 100%);
            box-shadow: 0 8px 16px -4px rgba(var(--c), 0.50), inset 0 1px 0 rgba(255,255,255,0.35);
            transition: transform 0.3s var(--ease);
        }
        .card:hover .icon { transform: scale(1.08) rotate(-3deg); }
        .icon svg { width: 24px; height: 24px; }

        .label {
            position: relative; z-index: 1;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(11px, 2.9vw, 13px);
            font-weight: 700; letter-spacing: -0.1px;
            line-height: 1.1;
            max-width: 94%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Modules à venir : un peu plus discrets */
        .card.soon { font: inherit; }
        .card.soon .icon { filter: saturate(0.85); }
        .badge-soon {
            position: absolute; top: 8px; right: 8px; z-index: 2;
            font-size: 8px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
            padding: 3px 6px; border-radius: 8px; line-height: 1;
            color: var(--orange-600);
            background: var(--orange-100);
            border: 1px solid #fed7aa;
        }

        /* Thèmes : [couleur principale] / [couleur claire] */
        .t-clients      { --c: 16, 149, 93;  --c2: 52, 190, 126; }
        .t-fournisseurs { --c: 234, 88, 12;  --c2: 251, 146, 60; }
        .t-matieres     { --c: 13, 148, 110; --c2: 45, 190, 156; }
        .t-produits     { --c: 245, 114, 20; --c2: 251, 165, 80; }
        .t-materiels    { --c: 22, 122, 74;  --c2: 52, 168, 110; }
        .t-ouvriers     { --c: 217, 85, 10;  --c2: 244, 130, 50; }
        .t-depenses     { --c: 225, 95, 35;  --c2: 248, 145, 85; }
        .t-situation    { --c: 15, 140, 120; --c2: 40, 186, 163; }
        .t-production   { --c: 249, 115, 22; --c2: 253, 164, 80; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.94); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card:nth-child(1) { animation-delay: .04s; } .card:nth-child(2) { animation-delay: .08s; }
        .card:nth-child(3) { animation-delay: .12s; } .card:nth-child(4) { animation-delay: .16s; }
        .card:nth-child(5) { animation-delay: .20s; } .card:nth-child(6) { animation-delay: .24s; }
        .card:nth-child(7) { animation-delay: .28s; } .card:nth-child(8) { animation-delay: .32s; }
        .card:nth-child(9) { animation-delay: .36s; }

        /* ===== FOOTER ===== */
        .footer {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
            font-size: 11px; font-weight: 700; color: var(--ink-soft);
        }
        .footer strong { color: var(--green-800); font-weight: 800; }
        .footer-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--orange-500); }

        /* ===== ÉCRANS COMPACTS ===== */
        @media (max-height: 720px) {
            .header { padding-bottom: 46px; }
            .greeting { margin-top: 14px; }
            .greeting-hello { font-size: 22px; }
            .section { padding-top: 12px; }
            .grid { gap: 9px; }
            .card { gap: 6px; border-radius: 18px; }
            .icon { width: 42px; height: 42px; border-radius: 14px; }
            .icon svg { width: 20px; height: 20px; }
        }
        @media (max-height: 620px) {
            .greeting-date { display: none; }
            .footer { display: none; }
        }
        @media (max-width: 360px) {
            .icon { width: 40px; height: 40px; }
            .label { font-size: 10.5px; }
        }

        /* ===== AUTH ===== */
        .authed #auth-overlay { display: none; }

        .auth-overlay {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            background: rgba(9, 36, 24, 0.62);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            transition: opacity 0.35s ease;
        }
        .auth-card {
            width: 100%; max-width: 350px;
            background: #fff;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(6, 30, 19, 0.38);
            animation: modalIn 0.4s var(--ease);
        }
        @keyframes modalIn { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

        .auth-head {
            position: relative; overflow: hidden;
            padding: 30px 22px 24px;
            text-align: center; color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(74,222,128,0.35), transparent 55%),
                radial-gradient(circle at 0% 100%, rgba(249,115,22,0.30), transparent 50%),
                linear-gradient(155deg, var(--green-900), var(--green-700) 60%, var(--green-600));
        }
        .auth-icon {
            width: 60px; height: 60px; margin: 0 auto 14px;
            border-radius: 20px;
            display: grid; place-items: center;
            background: rgba(255,255,255,0.16);
            border: 1.5px solid rgba(255,255,255,0.30);
            box-shadow: 0 6px 18px rgba(0,0,0,0.20);
        }
        .auth-icon svg { width: 27px; height: 27px; }
        .auth-head h2 { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
        .auth-head p { margin-top: 4px; font-size: 12px; font-weight: 700; color: #a7f3d0; }

        .auth-body { padding: 24px 22px 26px; display: flex; flex-direction: column; gap: 14px; }
        .auth-body label { font-size: 12.5px; font-weight: 800; color: var(--green-800); }
        .auth-input {
            width: 100%; margin-top: 8px;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1.5px solid #d3e8dc;
            background: #f6faf8;
            font: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .auth-input:focus { border-color: #16a34a; background: #fff; box-shadow: 0 0 0 4px rgba(34,197,94,0.16); }

        .auth-submit {
            padding: 14px; border-radius: 14px;
            font-size: 14px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--orange-500), var(--orange-600));
            box-shadow: 0 6px 20px rgba(234, 88, 12, 0.40);
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
        }
        .auth-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(234, 88, 12, 0.48); }
        .auth-submit:active { transform: scale(0.97); }
        .auth-submit:disabled { opacity: 0.7; cursor: wait; }

        .auth-error {
            display: none;
            padding: 10px 14px; border-radius: 12px;
            font-size: 12px; font-weight: 700; text-align: center;
            color: #be123c; background: #fff1f2; border: 1px solid #fecdd3;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); }
            40% { transform: translateX(9px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
            transform: translateX(-50%) translateY(20px);
            padding: 12px 22px; border-radius: 30px;
            font-size: 12.5px; font-weight: 700; color: #fff; white-space: nowrap;
            background: linear-gradient(135deg, var(--green-900), var(--green-700));
            border: 1px solid rgba(249,115,22,0.5);
            box-shadow: 0 10px 30px rgba(9, 36, 24, 0.38);
            opacity: 0; z-index: 999;
            transition: opacity 0.25s, transform 0.25s var(--ease);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-row">
                <div class="brand">
                    <div class="logo"><img src="logo.png" alt="Logo AMplast"></div>
                    <div class="brand-text">
                        <span class="brand-name">AMplast</span>
                        <span class="brand-title">Menu Principal</span>
                    </div>
                </div>
                <button id="btn-lock-session" class="btn-lock" title="Verrouiller la session" aria-label="Verrouiller la session">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </button>
            </div>
            <div class="greeting">
                <div id="greeting-hello" class="greeting-hello">Bonjour</div>
                <div id="current-date" class="greeting-date">Chargement...</div>
            </div>
        </header>

        <!-- ===== STATUT ===== -->
        <div class="status" role="status">
            <div class="status-left"><span class="status-dot"></span><span>Système de Gestion</span></div>
            <span class="status-version">En ligne · v2.5</span>
        </div>

        <div class="section">
            <span class="section-title">Modules</span>
            <div class="section-line"></div>
        </div>

        <!-- ===== GRILLE ===== -->
        <main class="main">
            <nav class="grid" aria-label="Modules">

                <a href="amclts.html" class="card t-clients" id="btn-clients" title="Gestion des Clients">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <span class="label">Clients</span>
                </a>

                <a href="amfrs.html" class="card t-fournisseurs" id="btn-fournisseurs" title="Gestion des Fournisseurs">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                            <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
                        </svg>
                    </div>
                    <span class="label">Fournisseurs</span>
                </a>

                <a href="amatiere.html" class="card t-matieres" id="btn-matieres" title="Matières Premières">
                    <div class="icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
                        </svg>
                    </div>
                    <span class="label">Matières</span>
                </a>

                <a href="amstock.html" class="card t-produits" id="btn-produits" title="Catalogue Produits">
                    <div class="icon">

    <!-- ===== AUTH ===== -->
    <div id="auth-overlay" class="auth-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <div class="auth-card">
            <div class="auth-head">
                <div class="auth-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <h2 id="auth-title">Accès Sécurisé</h2>
                <p>Système de Gestion AMplast</p>
            </div>
            <div class="auth-body">
                <div>
                    <label for="auth-password">Mot de passe administrateur</label>
                    <input type="password" id="auth-password" class="auth-input" placeholder="Entrez le mot de passe" autocomplete="current-password">
                </div>
                <div id="auth-error" class="auth-error" role="alert">Mot de passe incorrect. Veuillez réessayer.</div>
                <button id="auth-btn" class="auth-submit" type="button">Déverrouiller l'accès</button>
            </div>
        </div>
    </div>

    <script>
        /* ===== AUTHENTIFICATION ===== */
        const authOverlay  = document.getElementById('auth-overlay');
        const authPassword = document.getElementById('auth-password');
        const authBtn      = document.getElementById('auth-btn');
        const authError    = document.getElementById('auth-error');

        // SHA-256 du mot de passe actuel
        const EXPECTED_HASH = "d30ea69ba67ff9c8c9d52a2d202edb26d1a619b0baed813de401ec2dbf392448";

        async function hashString(str) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkAuth() {
            const pwd = authPassword.value;
            if (!pwd) { authPassword.focus(); return; }

            authBtn.textContent = 'Vérification...';
            authBtn.disabled = true;

            try {
                const hash = await hashString(pwd);
                if (hash === EXPECTED_HASH) {
                    localStorage.setItem('auth_data', JSON.stringify({ passed: 'true', time: Date.now() }));
                    authOverlay.style.opacity = '0';
                    setTimeout(() => {
                        document.documentElement.classList.add('authed');
                        authOverlay.style.opacity = '';
                        authPassword.value = '';
                    }, 350);
                } else {
                    authError.style.display = 'block';
                    authPassword.value = '';
                    authPassword.focus();
                    const card = document.querySelector('.auth-card');
                    card.style.animation = 'none';
                    void card.offsetWidth;
                    card.style.animation = 'shake 0.4s ease';
                }
            } catch (err) {
                console.error(err);
            } finally {
                authBtn.textContent = "Déverrouiller l'accès";
                authBtn.disabled = false;
            }
        }

        authBtn.addEventListener('click', checkAuth);
        authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') checkAuth(); });

        // Bouton cadenas : verrouille la session et réaffiche l'écran d'accès
        document.getElementById('btn-lock-session').addEventListener('click', () => {
            try { localStorage.removeItem('auth_data'); } catch (e) {}
            authError.style.display = 'none';
            document.documentElement.classList.remove('authed');
            setTimeout(() => authPassword.focus(), 50);
        });

        /* ===== SALUTATION & DATE ===== */
        (function () {
            const now = new Date();
            const h = now.getHours();
            const hello = h < 5 ? 'Bonsoir' : h < 18 ? 'Bonjour' : 'Bonsoir';
            document.getElementById('greeting-hello').textContent = hello + ' 👋';
            const s = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
            document.getElementById('current-date').textContent = s.charAt(0).toUpperCase() + s.slice(1);
        })();

        /* ===== MODULES À VENIR ===== */
        function comingSoon(name) {
            document.querySelectorAll('.toast').forEach(t => t.remove());
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = '🚧 ' + name + ' — Module en déploiement';
            document.body.appendChild(toast);
            requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('show')));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2600);
        }
        document.querySelectorAll('[data-soon]').forEach(el => {
            el.addEventListener('click', () => comingSoon(el.dataset.soon));
        });
    </script>

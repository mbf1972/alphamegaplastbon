<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Bon de Livraison - Création et gestion de bons">
    <meta name="theme-color" content="#0f172a">
    <title>Bon de Livraison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        const authData = JSON.parse(localStorage.getItem('auth_data') || '{}');
        const now = new Date().getTime();
        if (!(authData.passed === 'true' && (now - authData.time < 12 * 60 * 60 * 1000))) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>

    <!-- Title -->
    <header class="app-header" id="app-header">
        <button class="header-back" onclick="window.location.href='index.html'" aria-label="Retour">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h1 class="title">Bon de livraison</h1>
        <button class="btn-add-clients" id="btn-add-client" aria-label="Ajouter un client">+Client</button>
    </header>

    <!-- Client Info -->
    <section class="info-section" id="info-section">
        <div class="info-field">
            <label for="date-bon">Date</label>
            <input type="text" id="date-bon" placeholder="jj/mm/aaaa" maxlength="10" inputmode="numeric">
        </div>
        <div class="info-field">
            <label for="num-bon-display">N° Bon</label>
            <div id="num-bon-display">000000</div>
        </div>
        <div class="info-field full" style="position: relative;">
            <label for="client-nom">Client</label>
            <input type="text" id="client-nom" placeholder="Nom du client" autocomplete="off">
            <div id="autocomplete-list" class="autocomplete-items" style="display: none;"></div>
        </div>
        <div class="info-field full">
            <label for="client-adresse">Adresse</label>
            <input type="text" id="client-adresse" placeholder="Adresse du client">
        </div>
    </section>

    <!-- Input Row -->
    <section class="input-section" id="input-section">
        <div class="input-group">
            <label for="qte">Qte</label>
            <input type="number" id="qte" min="0" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="diam">Diam</label>
            <input type="number" id="diam" min="0" inputmode="numeric">
        </div>
        <div class="input-group">
            <label for="long">Long</label>
            <input type="number" id="long" min="0" step="any" inputmode="decimal">
        </div>
        <div class="input-group">
            <label for="prix">Prix</label>
            <input type="number" id="prix" min="0" step="any" inputmode="decimal">
        </div>
        <div class="input-group">
            <label for="sr">SR</label>
            <select id="sr">
                <option value="S1">S1</option>
                <option value="S2">S2</option>
            </select>
        </div>
        <div class="input-group">
            <label for="color">Color</label>
            <input type="text" id="color">
        </div>
    </section>

    <!-- Valider Button -->
    <section class="btn-section" id="btn-valider-section">
        <button class="btn-valider btn-shine" id="btn-valider">Valider</button>
    </section>

    <!-- Items Display Area (white zone) -->
    <section class="items-zone" id="items-zone">
        <!-- Items will be inserted here -->
    </section>

    <!-- Total Général -->
    <section class="total-section" id="total-section" style="display: none;">
        <div class="total-bar">
            <span class="total-label">Total Général :</span>
            <span class="total-value" id="total-general">0,00</span>
        </div>
    </section>

    <!-- Actions -->
    <section class="btn-section" id="btn-pdf-section">
        <button class="btn-pdf btn-shine" id="btn-pdf">PDF</button>
    </section>

    <!-- Modal d'ajout de client -->
    <div id="add-client-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">&times;</button>
            <h2 class="modal-title">Nouveau Client</h2>
            
            <div class="form-group">
                <label for="modal-client-type">Type de client</label>
                <select id="modal-client-type">
                    <option value="physique">Personne physique</option>
                    <option value="societe">Société</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="modal-client-nom">Nom <span style="color:red">*</span></label>
                <input type="text" id="modal-client-nom" placeholder="Nom du client / société" required>
            </div>
            
            <div class="form-group hidden" id="modal-ice-group">
                <label for="modal-client-ice">ICE <span style="color:red">*</span></label>
                <input type="text" id="modal-client-ice" placeholder="Identifiant Commun de l'Entreprise">
            </div>
            
            <div class="form-group">
                <label for="modal-client-adresse">Adresse <span style="color:red">*</span></label>
                <input type="text" id="modal-client-adresse" placeholder="Adresse complète" required>
            </div>
            
            <div class="form-group">
                <label for="modal-client-tel">Téléphone <span style="color:red">*</span></label>
                <input type="tel" id="modal-client-tel" placeholder="N° de téléphone" required>
            </div>
            
            <div class="form-group">
                <label for="modal-client-email">E-mail</label>
                <input type="email" id="modal-client-email" placeholder="Adresse e-mail (optionnel)">
            </div>
            
            <div class="form-group">
                <label for="modal-client-solde">Solde initial <span style="color:red">*</span></label>
                <input type="number" step="0.01" id="modal-client-solde" placeholder="0.00" value="0.00" required>
            </div>
            
            <div class="form-group">
                <label for="modal-client-plafond">Plafond de crédit <span style="color:red">*</span></label>
                <input type="number" step="0.01" id="modal-client-plafond" placeholder="100000.00" value="100000.00" required>
            </div>
            
            <button class="btn-save btn-shine" id="modal-btn-save-client">Enregistrer</button>
        </div>
    </div>

    <script src="app.js?v=1.0.1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e1b4b">
    <title>Fournisseurs — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Fournisseurs : Indigo Royal, Améthyste & Ambre Chaud */
            --primary: #4338ca;
            --primary-dark: #1e1b4b;
            --primary-light: #6366f1;
            --primary-soft: #818cf8;
            --primary-subtle: #eef2ff;

            --accent: #f59e0b;
            --accent-deep: #d97706;
            --accent-soft: #fef3c7;

            --bg-body: #e8ecf8;
            --bg-app: #f6f8fd;
            --card-bg: #ffffff;

            --text-main: #0f172a;
            --text-muted: #53647e;
            --text-dim: #8899b0;
            --amount-color: #d97706;
            --line: rgba(67, 56, 202, 0.10);

            --status-regle: #10b981;
            --status-regle-bg: #d1fae5;
            --status-echu: #ef4444;
            --status-echu-bg: #fee2e2;
            --status-attente: #f59e0b;
            --status-attente-bg: #fef3c7;

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 90% 0%, rgba(99, 102, 241, 0.25), transparent 65%),
                radial-gradient(ellipse 45% 40% at 0% 100%, rgba(245, 158, 11, 0.18), transparent 60%);
            pointer-events: none; z-index: 0;
        }

        button { font: inherit; }
        :focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #f8faff 0%, #f0f3fa 100%);
            box-shadow: 0 24px 70px rgba(30, 27, 75, 0.16), 0 0 0 1px rgba(67, 56, 202, 0.06);
        }

        /* ===== HEADER ===== */
        .app-header {
            position: relative;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 52px;
            color: #fff;
            background:
                radial-gradient(circle at 90% -10%, rgba(129, 140, 248, 0.40), transparent 50%),
                radial-gradient(circle at 0% 120%, rgba(245, 158, 11, 0.30), transparent 45%),
                linear-gradient(155deg, #1e1b4b 0%, #3730a3 55%, #4f46e5 100%);
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        .app-header::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1.3px);
            background-size: 16px 16px;
            -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            pointer-events: none;
        }

        .header-top {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .back-btn {
            width: 40px; height: 40px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 14px; color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s var(--ease), background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.26); transform: translateX(-2px); }
        .back-btn:active { transform: scale(0.92); }

        .brand-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px;
            color: #c7d2fe; text-transform: uppercase;
        }
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1;
        }

        .header-actions { display: flex; align-items: center; }
        .btn-new {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px; border: 0; border-radius: 14px; cursor: pointer;
            font-size: 12.5px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.45);
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
        }
        .btn-new:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(217, 119, 6, 0.55); }
        .btn-new:active { transform: scale(0.95); }

        /* Carte total solde (chevauche le header) */
        .total-solde {
            position: relative; z-index: 6;
            margin: -30px 16px 0;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: #fff; border-radius: 22px;
            box-shadow: 0 14px 32px -8px rgba(30, 27, 75, 0.22), 0 0 0 1px var(--line);
        }
        .total-label {
            display: block;
            font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--text-muted);
        }
        .total-amount {
            display: block; margin-top: 2px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 800; letter-spacing: -0.6px;
            color: var(--amount-color);
        }
        .total-badge {
            flex-shrink: 0;
            padding: 7px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 800; white-space: nowrap;
            color: var(--primary); background: #eef2ff; border: 1px solid #c7d2fe;
        }

        /* ===== TOOLBAR COLLANTE (SEARCH + FILTERS) ===== */
        .toolbar {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 16px 10px;
            background: rgba(248, 250, 255, 0.90);
            backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        }
        .search-container { position: relative; margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 13px 16px 13px 44px;
            font-size: 13.5px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
            box-shadow: 0 4px 14px -6px rgba(30, 27, 75, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input::placeholder { color: var(--text-dim); font-weight: 600; }
        .search-input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.16); }
        .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.55; pointer-events: none;
        }

        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex-shrink: 0; white-space: nowrap;
            padding: 8px 15px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer;
            font-size: 12px; font-weight: 800; color: var(--text-muted); background: #fff;
            transition: all 0.2s var(--ease);
        }
        .tab-btn:hover { border-color: rgba(99, 102, 241, 0.5); color: var(--primary); }
        .tab-btn.active {
            color: #fff; border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 6px 14px -4px rgba(67, 56, 202, 0.45);
        }

        /* ===== STATS ===== */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 16px 4px; }
        .stat-card {
            position: relative; overflow: hidden;
            padding: 10px 12px 10px; border-radius: 16px;
            background: #fff; border: 1px solid var(--line);
            box-shadow: 0 4px 14px -8px rgba(30, 27, 75, 0.10);
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--c, var(--primary-soft));
        }
        .stat-card.s-regle   { --c: var(--status-regle); }
        .stat-card.s-echu    { --c: var(--status-echu); }
        .stat-card.s-attente { --c: var(--status-attente); }
        .stat-label {
            display: flex; align-items: center; gap: 5px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            color: var(--c); margin-bottom: 3px;
        }
        .stat-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .stat-val {
            display: block; font-family: 'Outfit', sans-serif;
            font-size: 12.5px; font-weight: 800; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== LISTE FOURNISSEURS ===== */
        .suppliers-list { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 8px; }

        .supplier-card {
            position: relative; overflow: hidden; cursor: pointer;
            display: flex; align-items: center; gap: 13px;
            padding: 13px 14px 13px 18px;
            background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px;
            box-shadow: 0 6px 18px -8px rgba(30, 27, 75, 0.10), 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
            animation: cardIn 0.45s var(--ease) both;
        }
        .supplier-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 16px 30px -10px rgba(30, 27, 75, 0.18);
        }
        .supplier-card:active { transform: scale(0.98); transition-duration: 0.08s; }
        .supplier-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--status-c); }
        .supplier-card.regle   { --status-c: var(--status-regle); }
        .supplier-card.attente { --status-c: var(--status-attente); }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        .avatar {
            position: relative; flex-shrink: 0;
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center;
            font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; color: #fff;
            background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
            box-shadow: 0 8px 16px -6px rgba(67, 56, 202, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .avatar::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
            pointer-events: none;
        }

        .card-content { flex: 1; min-width: 0; }
        .supplier-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .supplier-meta-line {
            display: flex; align-items: center; gap: 8px; margin-top: 2px;
            font-size: 11px; font-weight: 700; color: var(--text-dim);
        }
        .cat-tag {
            background: #eef2ff; color: var(--primary);
            padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
        }

        .amount-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
        .amount {
            font-family: 'Outfit', sans-serif; font-size: 15.5px; font-weight: 800; letter-spacing: -0.3px;
            color: var(--status-c);
        }

        .status-pill {
            padding: 4px 10px; border-radius: 999px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
        }
        .pill-regle   { background: var(--status-regle-bg);   color: var(--status-regle); }
        .pill-attente { background: var(--status-attente-bg); color: var(--status-attente); }
        .pill-echu    { background: var(--status-echu-bg);    color: var(--status-echu); }

        .empty-state {
            text-align: center; padding: 44px 20px; color: var(--text-muted);
            font-size: 13px; font-weight: 700;
        }
        .empty-icon { font-size: 34px; margin-bottom: 8px; }
        .empty-title { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .empty-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
        .btn-empty {
            padding: 9px 18px; border-radius: 12px; border: 0; cursor: pointer;
            font-size: 12px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .eco-footer {
            margin-top: auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
            text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }

        /* ===== MODAL DETAIL FOURNISSEUR (BOTTOM SHEET) ===== */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            width: 100%; max-width: 440px; max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-app);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -16px 50px rgba(0,0,0,0.28);
            animation: slideUp 0.35s var(--ease);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

        .modal-header {
            position: relative; flex-shrink: 0; overflow: hidden;
            padding: 22px 20px 18px; color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(129, 140, 248, 0.40), transparent 55%),
                radial-gradient(circle at 0% 120%, rgba(245, 158, 11, 0.28), transparent 50%),
                linear-gradient(155deg, #1e1b4b, #3730a3 60%, #4f46e5);
        }
        .modal-header::before {
            content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.35);
        }
        .modal-close {
            position: absolute; top: 16px; right: 14px;
            width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
            display: grid; place-items: center; cursor: pointer;
            font-size: 20px; line-height: 1; color: #fff; background: rgba(255,255,255,0.16);
            transition: background 0.2s, transform 0.2s var(--ease);
        }
        .modal-close:hover { background: rgba(245, 158, 11, 0.5); transform: rotate(90deg); }
        .modal-title {
            padding-right: 44px; margin-top: 6px;
            font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2;
        }
        .modal-subtitle { margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #c7d2fe; }

        .modal-body {
            padding: 16px 18px 28px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .info-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 4px 14px -6px rgba(30, 27, 75, 0.08);
            border: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 8px;
        }

        .btn-action-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .btn-action-sheet {
            padding: 12px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
            text-align: center; text-decoration: none; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s var(--ease);
        }
        .btn-action-sheet:active { transform: scale(0.96); }

        .btn-call {
            background: #fff; color: var(--primary);
            border: 1.5px solid #c7d2fe;
        }
        .btn-call:hover { background: #eef2ff; }

        .btn-pay {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 6px 16px -6px rgba(67, 56, 202, 0.55);
        }
        .btn-pay:hover { transform: translateY(-1px); }

        .btn-delete-item {
            background: #fff1f2; color: #be123c; border: 1px solid #fecdd3;
            padding: 11px; border-radius: 12px; font-size: 12px; font-weight: 800;
            cursor: pointer; margin-top: 4px; transition: all 0.15s;
        }
        .btn-delete-item:hover { background: #ffe4e6; }

        /* ===== MODAL NOUVEAU FOURNISSEUR ===== */
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
        .form-group label { font-size: 11.5px; font-weight: 800; color: #374151; }
        .form-control {
            width: 100%; padding: 11px 13px; outline: none;
            font-size: 13px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid #cbd5e1; border-radius: 12px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-submit {
            padding: 13px 18px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-size: 13.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 18px rgba(67, 56, 202, 0.35);
            transition: all 0.2s; margin-top: 6px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(67, 56, 202, 0.45); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn" title="Retour au Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="brand-meta">
                    <div class="brand-name">ACHATS &amp; FOURNISSEURS</div>
                    <div class="header-title">Fournisseurs</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick="openAddModal()">+ Nouveau</button>
            </div>
        </div>
    </header>

    <!-- Carte Solde Global Dû (chevauchement) -->
    <div class="total-solde">
        <div>
            <span class="total-label">📈 Total Solde Dû</span>
            <span class="total-amount" id="kpi-total">0 DH</span>
        </div>
        <div class="total-badge" id="kpi-count">6 comptes</div>
    </div>

    <!-- Toolbar sticky (Recherche + Filtres) -->
    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-suppliers" placeholder="Rechercher nom, catégorie, ville..." autocomplete="off">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Tous</button>
            <button class="tab-btn" data-filter="Matières PE">Matières PE</button>
            <button class="tab-btn" data-filter="Additifs">Additifs</button>
            <button class="tab-btn" data-filter="Outillage">Outillage</button>
            <button class="tab-btn" data-filter="Emballage">Emballage</button>
            <button class="tab-btn" data-filter="Services">Services</button>
        </div>
    </div>

    <!-- Mini stats bar -->
    <div class="stats-bar">
        <div class="stat-card s-regle">
            <span class="stat-label">Actifs</span>
            <span class="stat-val" id="kpi-actifs">-</span>
        </div>
        <div class="stat-card s-attente">
            <span class="stat-label">Avec Solde</span>
            <span class="stat-val" id="kpi-avec-solde">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="--c: var(--primary);">Catégories</span>
            <span class="stat-val" id="kpi-categories">5 secteurs</span>
        </div>
    </div>

    <!-- Suppliers Cards Grid -->
    <div class="suppliers-list" id="suppliers-list"></div>

    <div class="eco-footer">🌿 AMplast • Gestion Achats &amp; Partenaires Industriels</div>
</div>

<!-- ===== MODAL DETAIL FOURNISSEUR (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeDetail()">×</button>
            <div class="modal-title" id="det-name">Fournisseur</div>
            <div class="modal-subtitle" id="det-cat">Catégorie</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- Content injected dynamically -->
        </div>
    </div>
</div>

<!-- ===== MODAL NOUVEAU FOURNISSEUR (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <div class="modal-title">Nouveau Fournisseur</div>
            <div class="modal-subtitle">Enregistrement d'un partenaire</div>
        </div>
        <form id="add-supplier-form" class="modal-body">
            <div class="form-group">
                <label>Raison Sociale / Nom *</label>
                <input type="text" id="sup-name" class="form-control" placeholder="Ex: Maghreb Polymères SARL" required>
            </div>
            <div class="form-group">
                <label>Catégorie de Produits *</label>
                <select id="sup-cat" class="form-control" required>
                    <option value="Matières PE">Matières Plastiques (PEBD / PEHD)</option>
                    <option value="Additifs">Colorants & Additifs (Masterbatch)</option>
                    <option value="Outillage">Outillage & Pièces d'extrusion</option>
                    <option value="Emballage">Emballages & Mandrins</option>
                    <option value="Services">Services & Maintenance</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Téléphone *</label>
                    <input type="tel" id="sup-phone" class="form-control" placeholder="0522-000000" required>
                </div>
                <div class="form-group">
                    <label>Ville</label>
                    <input type="text" id="sup-city" class="form-control" placeholder="Casablanca...">
                </div>
            </div>
            <div class="form-group">
                <label>Solde Initial / En cours (DH)</label>
                <input type="number" id="sup-balance" class="form-control" placeholder="0" value="0">
            </div>
            <button type="submit" class="btn-submit">Enregistrer le Fournisseur</button>
        </form>
    </div>
</div>

<script>
    const DEFAULT_SUPPLIERS = [
        {
            id: 1,
            name: "SABIC Petrochemicals Maghreb",
            category: "Matières PE",
            product: "Granulés PEBD 2420D / PEHD F00952",
            phone: "+212 522 34 56 78",
            city: "Casablanca, Z.I.",
            balance: 54200,
            status: "Actif",
            rating: "A+"
        },
        {
            id: 2,
            name: "TotalEnergies Polymers & Additives",
            category: "Matières PE",
            product: "Polymères vierges & haute résistance",
            phone: "+212 522 98 12 34",
            city: "Tanger Free Zone",
            balance: 38400,
            status: "Actif",
            rating: "A"
        },
        {
            id: 3,
            name: "Maghreb Colorants & Masterbatch",
            category: "Additifs",
            product: "Colorant blanc opaque, bleu, stabilisants UV",
            phone: "+212 523 45 67 89",
            city: "Mohammedia",
            balance: 14500,
            status: "Actif",
            rating: "A"
        },
        {
            id: 4,
            name: "Plast-Outillage Maroc",
            category: "Outillage",
            product: "Filières d'extrusion, anneaux de soufflage, lames",
            phone: "+212 522 11 22 33",
            city: "Ain Sebaa, Casa",
            balance: 21750,
            status: "Actif",
            rating: "B+"
        },
        {
            id: 5,
            name: "Cartonnerie Atlas Emballages",
            category: "Emballage",
            product: "Mandrins carton pour bobines, rouleaux adhésifs",
            phone: "+212 522 77 88 99",
            city: "Berrechid",
            balance: 9200,
            status: "Actif",
            rating: "A"
        },
        {
            id: 6,
            name: "Trans-Logistique Express",
            category: "Services",
            product: "Livraison conteneurs matières & fret",
            phone: "+212 539 32 10 00",
            city: "Tanger Med",
            balance: 4800,
            status: "Actif",
            rating: "A"
        }
    ];

    function getSuppliers() {
        const data = localStorage.getItem('amplast_suppliers');
        if (data) {
            try { return JSON.parse(data); } catch(e) {}
        }
        return DEFAULT_SUPPLIERS;
    }

    function saveSuppliers(list) {
        localStorage.setItem('amplast_suppliers', JSON.stringify(list));
        renderSuppliers();
        updateKPIs();
    }

    let currentFilter = 'all';

    function renderSuppliers() {
        const list = getSuppliers();
        const searchVal = document.getElementById('search-suppliers').value.toLowerCase().trim();
        const container = document.getElementById('suppliers-list');

        const filtered = list.filter(sup => {
            const matchesSearch = sup.name.toLowerCase().includes(searchVal) ||
                                  sup.category.toLowerCase().includes(searchVal) ||
                                  (sup.product && sup.product.toLowerCase().includes(searchVal)) ||
                                  (sup.city && sup.city.toLowerCase().includes(searchVal));
            const matchesFilter = currentFilter === 'all' || sup.category === currentFilter;
            return matchesSearch && matchesFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <div class="empty-title">Aucun fournisseur trouvé</div>
                    <div class="empty-sub">Modifiez votre recherche ou ajoutez un nouveau partenaire.</div>
                    <button class="btn-empty" onclick="openAddModal()">+ Nouveau fournisseur</button>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(sup => {
            const hasBalance = Number(sup.balance) > 0;
            const statusClass = hasBalance ? 'attente' : 'regle';
            const pillClass = hasBalance ? 'pill-attente' : 'pill-regle';
            const statusLabel = hasBalance ? 'À Régler' : 'À jour';

            return `
                <div class="supplier-card ${statusClass}" onclick="openDetail(${sup.id})">
                    <div class="avatar">${sup.name.charAt(0)}</div>
                    <div class="card-content">
                        <div class="supplier-name">${sup.name}</div>
                        <div class="supplier-meta-line">
                            <span class="cat-tag">${sup.category}</span>
                            <span>📍 ${sup.city || 'Maroc'}</span>
                        </div>
                        <div class="amount-row">
                            <span class="amount">${Number(sup.balance).toLocaleString('fr-FR')} <span style="font-size:10px;font-weight:700;">DH</span></span>
                            <span class="status-pill ${pillClass}">${statusLabel}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateKPIs() {
        const list = getSuppliers();
        document.getElementById('kpi-count').textContent = `${list.length} comptes`;
        
        const total = list.reduce((sum, s) => sum + (Number(s.balance) || 0), 0);
        document.getElementById('kpi-total').textContent = total.toLocaleString('fr-FR') + ' DH';

        const avecSolde = list.filter(s => Number(s.balance) > 0).length;
        document.getElementById('kpi-actifs').textContent = `${list.length} actifs`;
        document.getElementById('kpi-avec-solde').textContent = `${avecSolde} comptes`;
        document.getElementById('kpi-categories').textContent = `5 secteurs`;
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    document.getElementById('add-supplier-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const list = getSuppliers();
        const newSup = {
            id: Date.now(),
            name: document.getElementById('sup-name').value.trim(),
            category: document.getElementById('sup-cat').value,
            product: "Approvisionnement matières & composants",
            phone: document.getElementById('sup-phone').value.trim(),
            city: document.getElementById('sup-city').value.trim() || "Maroc",
            balance: parseFloat(document.getElementById('sup-balance').value) || 0,
            status: "Actif",
            rating: "A"
        };

        list.unshift(newSup);
        saveSuppliers(list);
        document.getElementById('add-supplier-form').reset();
        closeAddModal();
    });

    function openDetail(id) {
        const list = getSuppliers();
        const sup = list.find(s => s.id === id);
        if (!sup) return;

        document.getElementById('det-name').textContent = sup.name;
        document.getElementById('det-cat').textContent = sup.category + " • " + (sup.city || "Maroc");

        const body = document.getElementById('detail-body');
        body.innerHTML = `
            <div class="info-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Solde Dû</span>
                    <span class="status-pill ${Number(sup.balance) > 0 ? 'pill-attente' : 'pill-regle'}">
                        ${Number(sup.balance) > 0 ? 'En cours' : 'Soldé'}
                    </span>
                </div>
                <div style="font-family:'Outfit'; font-size:24px; font-weight:800; color:var(--amount-color); margin-top:2px;">
                    ${Number(sup.balance).toLocaleString('fr-FR')} <span style="font-size:13px;">DH</span>
                </div>
            </div>

            <div class="info-card" style="font-size:12px; gap:8px;">
                <div><strong>📞 Contact :</strong> <a href="tel:${sup.phone}" style="color:var(--primary-light); text-decoration:none; font-weight:700;">${sup.phone}</a></div>
                <div><strong>📍 Adresse :</strong> ${sup.city || 'Maroc'}</div>
                <div><strong>📦 Spécialité :</strong> ${sup.product || 'N/A'}</div>
                <div><strong>⭐ Notation :</strong> <span style="color:#d97706; font-weight:800;">${sup.rating || 'A'}</span></div>
            </div>

            <div class="btn-action-row">
                <a href="tel:${sup.phone}" class="btn-action-sheet btn-call">
                    📞 Appeler
                </a>
                <button onclick="recordPayment(${sup.id})" class="btn-action-sheet btn-pay">
                    💵 Régler
                </button>
            </div>

            <button onclick="deleteSupplier(${sup.id})" class="btn-delete-item">
                🗑️ Supprimer ce fournisseur
            </button>
        `;

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    function recordPayment(id) {
        const amount = prompt("Montant du règlement effectué (DH) :");
        if (amount && !isNaN(amount)) {
            const list = getSuppliers();
            const sup = list.find(s => s.id === id);
            if (sup) {
                sup.balance = Math.max(0, sup.balance - parseFloat(amount));
                saveSuppliers(list);
                openDetail(id);
            }
        }
    }

    function deleteSupplier(id) {
        if (confirm("Confirmer la suppression de ce fournisseur ?")) {
            let list = getSuppliers();
            list = list.filter(s => s.id !== id);
            saveSuppliers(list);
            closeDetail();
        }
    }

    // Filtres & Recherche
    document.getElementById('search-suppliers').addEventListener('input', renderSuppliers);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderSuppliers();
        });
    });

    // Close on overlay click
    [document.getElementById('add-modal'), document.getElementById('detail-modal')].forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

    // Init
    renderSuppliers();
    updateKPIs();
</script>
</body>
</html>

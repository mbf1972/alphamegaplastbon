<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#064e3b">
    <title>Matières Premières — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Matières : Émeraude Écologique, Menthe & Résine */
            --primary: #059669;
            --primary-dark: #064e3b;
            --primary-light: #10b981;
            --primary-soft: #34d399;
            --primary-subtle: #ecfdf5;

            --accent: #f97316;
            --accent-deep: #ea580c;
            --accent-soft: #ffedd5;

            --bg-body: #e4f4ec;
            --bg-app: #f4fbf7;
            --card-bg: #ffffff;

            --text-main: #06281e;
            --text-muted: #4a7565;
            --text-dim: #79a191;
            --amount-color: #ea580c;
            --line: rgba(5, 150, 105, 0.12);

            --status-regle: #059669;
            --status-regle-bg: #d1fae5;
            --status-echu: #dc2626;
            --status-echu-bg: #fee2e2;
            --status-attente: #ea580c;
            --status-attente-bg: #ffedd5;

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 90% 0%, rgba(52, 211, 153, 0.30), transparent 65%),
                radial-gradient(ellipse 45% 40% at 0% 100%, rgba(249, 115, 22, 0.16), transparent 60%);
            pointer-events: none; z-index: 0;
        }

        button { font: inherit; }
        :focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #f7fcf9 0%, #edf7f2 100%);
            box-shadow: 0 24px 70px rgba(6, 78, 59, 0.16), 0 0 0 1px rgba(5, 150, 105, 0.08);
        }

        /* ===== HEADER ===== */
        .app-header {
            position: relative;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 52px;
            color: #fff;
            background:
                radial-gradient(circle at 90% -10%, rgba(52, 211, 153, 0.45), transparent 50%),
                radial-gradient(circle at 0% 120%, rgba(249, 115, 22, 0.28), transparent 45%),
                linear-gradient(155deg, #064e3b 0%, #047857 55%, #059669 100%);
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        .app-header::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.3px);
            background-size: 16px 16px;
            -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            pointer-events: none;
        }

        .header-top {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .back-btn {
            width: 40px; height: 40px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 14px; color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s var(--ease), background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.26); transform: translateX(-2px); }
        .back-btn:active { transform: scale(0.92); }

        .brand-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px;
            color: #a7f3d0; text-transform: uppercase;
        }
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1;
        }

        .header-actions { display: flex; align-items: center; }
        .btn-new {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px; border: 0; border-radius: 14px; cursor: pointer;
            font-size: 12.5px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 6px 18px rgba(234, 88, 12, 0.40);
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
        }
        .btn-new:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(234, 88, 12, 0.50); }
        .btn-new:active { transform: scale(0.95); }

        /* Carte total solde (chevauche le header) */
        .total-solde {
            position: relative; z-index: 6;
            margin: -30px 16px 0;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: #fff; border-radius: 22px;
            box-shadow: 0 14px 32px -8px rgba(6, 78, 59, 0.22), 0 0 0 1px var(--line);
        }
        .total-label {
            display: block;
            font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--text-muted);
        }
        .total-amount {
            display: block; margin-top: 2px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 800; letter-spacing: -0.6px;
            color: var(--primary);
        }
        .total-badge {
            flex-shrink: 0;
            padding: 7px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 800; white-space: nowrap;
            color: var(--primary-dark); background: #d1fae5; border: 1px solid #a7f3d0;
        }

        /* ===== TOOLBAR COLLANTE (SEARCH + FILTERS) ===== */
        .toolbar {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 16px 10px;
            background: rgba(247, 252, 249, 0.90);
            backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        }
        .search-container { position: relative; margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 13px 16px 13px 44px;
            font-size: 13.5px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
            box-shadow: 0 4px 14px -6px rgba(6, 78, 59, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input::placeholder { color: var(--text-dim); font-weight: 600; }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.16); }
        .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.55; pointer-events: none;
        }

        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex-shrink: 0; white-space: nowrap;
            padding: 8px 15px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer;
            font-size: 12px; font-weight: 800; color: var(--text-muted); background: #fff;
            transition: all 0.2s var(--ease);
        }
        .tab-btn:hover { border-color: rgba(5, 150, 105, 0.5); color: var(--primary); }
        .tab-btn.active {
            color: #fff; border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 6px 14px -4px rgba(5, 150, 105, 0.45);
        }

        /* ===== STATS ===== */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 16px 4px; }
        .stat-card {
            position: relative; overflow: hidden;
            padding: 10px 12px 10px; border-radius: 16px;
            background: #fff; border: 1px solid var(--line);
            box-shadow: 0 4px 14px -8px rgba(6, 78, 59, 0.10);
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--c, var(--primary-soft));
        }
        .stat-card.s-regle   { --c: var(--status-regle); }
        .stat-card.s-echu    { --c: var(--status-echu); }
        .stat-card.s-attente { --c: var(--status-attente); }
        .stat-label {
            display: flex; align-items: center; gap: 5px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            color: var(--c); margin-bottom: 3px;
        }
        .stat-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .stat-val {
            display: block; font-family: 'Outfit', sans-serif;
            font-size: 12.5px; font-weight: 800; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== LISTE MATIÈRES ===== */
        .items-list { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 8px; }

        .item-card {
            position: relative; overflow: hidden; cursor: pointer;
            display: flex; align-items: center; gap: 13px;
            padding: 13px 14px 13px 18px;
            background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px;
            box-shadow: 0 6px 18px -8px rgba(6, 78, 59, 0.10), 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
            animation: cardIn 0.45s var(--ease) both;
        }
        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(5, 150, 105, 0.4);
            box-shadow: 0 16px 30px -10px rgba(6, 78, 59, 0.18);
        }
        .item-card:active { transform: scale(0.98); transition-duration: 0.08s; }
        .item-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--status-c); }
        .item-card.regle   { --status-c: var(--status-regle); }
        .item-card.attente { --status-c: var(--status-attente); }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        .avatar {
            position: relative; flex-shrink: 0;
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center;
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: #fff;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            box-shadow: 0 8px 16px -6px rgba(5, 150, 105, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .avatar::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
            pointer-events: none;
        }

        .card-content { flex: 1; min-width: 0; }
        .item-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-meta-line {
            display: flex; align-items: center; gap: 8px; margin-top: 2px;
            font-size: 11px; font-weight: 700; color: var(--text-dim);
            flex-wrap: wrap;
        }
        .cat-tag {
            background: #ecfdf5; color: var(--primary);
            padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
        }
        .tag-stock-low {
            background: #fee2e2; color: #dc2626;
            padding: 2px 6px; border-radius: 6px; font-size: 9.5px; font-weight: 800;
        }

        .amount-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
        .amount {
            font-family: 'Outfit', sans-serif; font-size: 15.5px; font-weight: 800; letter-spacing: -0.3px;
            color: var(--status-c);
        }
        .price-badge {
            font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 800;
            color: var(--text-muted); background: #f0fdf4; border: 1px solid #d1fae5;
            padding: 2px 8px; border-radius: 8px;
        }

        .status-pill {
            padding: 4px 10px; border-radius: 999px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
        }
        .pill-regle   { background: var(--status-regle-bg);   color: var(--status-regle); }
        .pill-attente { background: var(--status-attente-bg); color: var(--status-attente); }

        .empty-state {
            text-align: center; padding: 44px 20px; color: var(--text-muted);
            font-size: 13px; font-weight: 700;
        }
        .empty-icon { font-size: 34px; margin-bottom: 8px; }
        .empty-title { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .empty-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
        .btn-empty {
            padding: 9px 18px; border-radius: 12px; border: 0; cursor: pointer;
            font-size: 12px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .eco-footer {
            margin-top: auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
            text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }

        /* ===== MODAL DETAIL MATIERE (BOTTOM SHEET) ===== */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            background: rgba(6, 78, 59, 0.55);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            width: 100%; max-width: 440px; max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-app);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -16px 50px rgba(0,0,0,0.28);
            animation: slideUp 0.35s var(--ease);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

        .modal-header {
            position: relative; flex-shrink: 0; overflow: hidden;
            padding: 22px 20px 18px; color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(52, 211, 153, 0.40), transparent 55%),
                radial-gradient(circle at 0% 120%, rgba(249, 115, 22, 0.28), transparent 50%),
                linear-gradient(155deg, #064e3b, #047857 60%, #059669);
        }
        .modal-header::before {
            content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.35);
        }
        .modal-close {
            position: absolute; top: 16px; right: 14px;
            width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
            display: grid; place-items: center; cursor: pointer;
            font-size: 20px; line-height: 1; color: #fff; background: rgba(255,255,255,0.16);
            transition: background 0.2s, transform 0.2s var(--ease);
        }
        .modal-close:hover { background: rgba(249, 115, 22, 0.5); transform: rotate(90deg); }
        .modal-title {
            padding-right: 44px; margin-top: 6px;
            font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2;
        }
        .modal-subtitle { margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #a7f3d0; }

        .modal-body {
            padding: 16px 18px 28px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .info-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 4px 14px -6px rgba(6, 78, 59, 0.08);
            border: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 8px;
        }

        .btn-action-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .btn-action-sheet {
            padding: 12px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
            text-align: center; text-decoration: none; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s var(--ease);
        }
        .btn-action-sheet:active { transform: scale(0.96); }

        .btn-in-stock {
            background: #ecfdf5; color: #047857;
            border: 1.5px solid #a7f3d0;
        }
        .btn-in-stock:hover { background: #d1fae5; }

        .btn-out-stock {
            background: #fff7ed; color: #c2410c;
            border: 1.5px solid #fed7aa;
        }
        .btn-out-stock:hover { background: #ffedd5; }

        .btn-delete-item {
            background: #fff1f2; color: #be123c; border: 1px solid #fecdd3;
            padding: 11px; border-radius: 12px; font-size: 12px; font-weight: 800;
            cursor: pointer; margin-top: 4px; transition: all 0.15s;
        }
        .btn-delete-item:hover { background: #ffe4e6; }

        /* ===== MODAL NOUVELLE MATIERE ===== */
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
        .form-group label { font-size: 11.5px; font-weight: 800; color: #374151; }
        .form-control {
            width: 100%; padding: 11px 13px; outline: none;
            font-size: 13px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid #cbd5e1; border-radius: 12px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.18);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-submit {
            padding: 13px 18px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-size: 13.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 18px rgba(5, 150, 105, 0.35);
            transition: all 0.2s; margin-top: 6px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(5, 150, 105, 0.45); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn" title="Retour au Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="brand-meta">
                    <div class="brand-name">RÉSINES &amp; MATIÈRES</div>
                    <div class="header-title">Matières Premières</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick="openAddModal()">+ Nouveau</button>
            </div>
        </div>
    </header>

    <!-- Carte Stock Total (chevauchement) -->
    <div class="total-solde">
        <div>
            <span class="total-label">⚖️ Stock Total Silos &amp; Sacs</span>
            <span class="total-amount" id="highlight-stock">0 Kg</span>
        </div>
        <div class="total-badge" id="kpi-count">5 matières</div>
    </div>

    <!-- Toolbar sticky (Recherche + Filtres) -->
    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher grade, matière, silo..." autocomplete="off">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Toutes</button>
            <button class="tab-btn" data-filter="PEBD">PEBD</button>
            <button class="tab-btn" data-filter="PEHD">PEHD</button>
            <button class="tab-btn" data-filter="Additifs">Additifs</button>
            <button class="tab-btn" data-filter="Recyclé">Recyclé</button>
        </div>
    </div>

    <!-- Mini stats bar -->
    <div class="stats-bar">
        <div class="stat-card s-regle">
            <span class="stat-label">Normal</span>
            <span class="stat-val" id="kpi-normal">-</span>
        </div>
        <div class="stat-card s-attente">
            <span class="stat-label">Alertes Seuil</span>
            <span class="stat-val" id="kpi-alertes">-</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="--c: var(--accent);">Valeur Stock</span>
            <span class="stat-val" id="kpi-valeur">-</span>
        </div>
    </div>

    <!-- Items Cards Grid -->
    <div class="items-list" id="items-list"></div>

    <div class="eco-footer">🌿 AMplast • Gestion Écologique &amp; Résines Industrielles</div>
</div>

<!-- ===== MODAL DETAIL MATIERE (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeDetail()">×</button>
            <div class="modal-title" id="det-name">Matière Première</div>
            <div class="modal-subtitle" id="det-cat">Grade &amp; Catégorie</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- Content injected dynamically -->
        </div>
    </div>
</div>

<!-- ===== MODAL NOUVELLE MATIERE (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <div class="modal-title">Nouvelle Matière</div>
            <div class="modal-subtitle">Approvisionnement &amp; Stock</div>
        </div>
        <form id="add-form" class="modal-body">
            <div class="form-group">
                <label>Désignation / Grade *</label>
                <input type="text" id="f-name" class="form-control" placeholder="Ex: PEBD Sabic 2420D" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Catégorie *</label>
                    <select id="f-cat" class="form-control" required>
                        <option value="PEBD">PEBD (Basse Densité)</option>
                        <option value="PEHD">PEHD (Haute Densité)</option>
                        <option value="Additifs">Additifs &amp; Masterbatch</option>
                        <option value="Recyclé">Matière Recyclée</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fournisseur</label>
                    <input type="text" id="f-supplier" class="form-control" placeholder="Ex: SABIC, Total...">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Stock Actuel (Kg) *</label>
                    <input type="number" id="f-stock" class="form-control" placeholder="0" required>
                </div>
                <div class="form-group">
                    <label>Seuil d'alerte (Kg)</label>
                    <input type="number" id="f-seuil" class="form-control" placeholder="1000" value="1000">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Prix estimé (DH/Kg)</label>
                    <input type="number" step="0.1" id="f-price" class="form-control" placeholder="16.5" value="16.5">
                </div>
                <div class="form-group">
                    <label>Silo / Emplacement</label>
                    <input type="text" id="f-loc" class="form-control" placeholder="Silo 1...">
                </div>
            </div>
            <button type="submit" class="btn-submit">Enregistrer la Matière</button>
        </form>
    </div>
</div>

<script>
    const DEFAULT_DATA = [
        { id: 1, name: "PEBD Vierge Sabic 2420D", cat: "PEBD", supplier: "SABIC Petrochemicals", stock: 14500, seuil: 3000, price: 16.5, loc: "Silo Principal 1" },
        { id: 2, name: "PEHD Vierge F00952", cat: "PEHD", supplier: "TotalEnergies Polymers", stock: 8200, seuil: 2500, price: 17.2, loc: "Silo 2" },
        { id: 3, name: "Masterbatch Blanc Opaque 70%", cat: "Additifs", supplier: "Maghreb Colorants", stock: 650, seuil: 800, price: 42.0, loc: "Zone Additifs A3" },
        { id: 4, name: "Stabilisant Anti-UV 3 Ans", cat: "Additifs", supplier: "Maghreb Colorants", stock: 220, seuil: 300, price: 65.0, loc: "Zone Additifs A1" },
        { id: 5, name: "Régénéré / Broyé Propre PEBD", cat: "Recyclé", supplier: "Recyclage Interne AMplast", stock: 4500, seuil: 1500, price: 9.0, loc: "Zone Broyage B1" }
    ];
    const STORAGE_KEY = 'amplast_matieres';

    function getItems() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            try { return JSON.parse(data); } catch(e) {}
        }
        return DEFAULT_DATA;
    }

    function saveItems(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        renderList();
        updateKPIs();
    }

    let currentFilter = 'all';

    function renderList() {
        const list = getItems();
        const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
        const container = document.getElementById('items-list');

        const filtered = list.filter(item => {
            const str = JSON.stringify(item).toLowerCase();
            const matchSearch = str.includes(searchVal);
            const matchFilter = currentFilter === 'all' || item.cat === currentFilter;
            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🌱</div>
                    <div class="empty-title">Aucune matière trouvée</div>
                    <div class="empty-sub">Modifiez votre recherche ou ajoutez une nouvelle résine.</div>
                    <button class="btn-empty" onclick="openAddModal()">+ Nouvelle matière</button>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isLow = Number(item.stock) <= Number(item.seuil || 1000);
            const cardClass = isLow ? 'attente' : 'regle';
            const pillClass = isLow ? 'pill-attente' : 'pill-regle';

            return `
                <div class="item-card ${cardClass}" onclick="openDetail(${item.id})">
                    <div class="avatar">${item.cat.substring(0, 2).toUpperCase()}</div>
                    <div class="card-content">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta-line">
                            <span class="cat-tag">${item.cat}</span>
                            <span>📍 ${item.loc || 'Silo'}</span>
                            ${isLow ? '<span class="tag-stock-low">Seuil Atteint</span>' : ''}
                        </div>
                        <div class="amount-row">
                            <span class="amount">⚖️ ${Number(item.stock).toLocaleString('fr-FR')} Kg</span>
                            <span class="price-badge">${Number(item.price).toFixed(1)} DH/Kg</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateKPIs() {
        const list = getItems();
        document.getElementById('kpi-count').textContent = `${list.length} matières`;

        const totalStock = list.reduce((s, m) => s + (Number(m.stock) || 0), 0);
        const totalVal = list.reduce((s, m) => s + ((Number(m.stock) || 0) * (Number(m.price) || 0)), 0);
        const lowStockCount = list.filter(m => Number(m.stock) <= Number(m.seuil || 1000)).length;
        const normalCount = list.length - lowStockCount;

        document.getElementById('kpi-normal').textContent = `${normalCount} ok`;
        document.getElementById('kpi-alertes').textContent = `${lowStockCount} alertes`;
        document.getElementById('kpi-valeur').textContent = `${(totalVal / 1000).toFixed(0)} kDH`;

        document.getElementById('highlight-stock').textContent = `${totalStock.toLocaleString('fr-FR')} Kg`;
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const list = getItems();
        const newItem = {
            id: Date.now(),
            name: document.getElementById('f-name').value.trim(),
            cat: document.getElementById('f-cat').value,
            supplier: document.getElementById('f-supplier').value.trim() || 'Fournisseur direct',
            stock: parseInt(document.getElementById('f-stock').value) || 0,
            seuil: parseInt(document.getElementById('f-seuil').value) || 1000,
            price: parseFloat(document.getElementById('f-price').value) || 16.5,
            loc: document.getElementById('f-loc').value.trim() || 'Silo'
        };

        list.unshift(newItem);
        saveItems(list);
        document.getElementById('add-form').reset();
        closeAddModal();
    });

    function openDetail(id) {
        const list = getItems();
        const item = list.find(x => x.id === id);
        if (!item) return;

        document.getElementById('det-name').textContent = item.name;
        document.getElementById('det-cat').textContent = item.cat + " • " + (item.loc || 'Silo');

        const isLow = Number(item.stock) <= Number(item.seuil || 1000);
        const pillClass = isLow ? 'pill-attente' : 'pill-regle';

        const body = document.getElementById('detail-body');
        body.innerHTML = `
            <div class="info-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Stock en Silo</span>
                    <span class="status-pill ${pillClass}">${isLow ? 'Alerte Seuil' : 'Stock Normal'}</span>
                </div>
                <div style="font-family:'Outfit'; font-size:24px; font-weight:800; color:var(--amount-color); margin-top:2px;">
                    ${Number(item.stock).toLocaleString('fr-FR')} <span style="font-size:13px;">Kg</span>
                </div>
            </div>

            <div class="info-card" style="font-size:12px; gap:8px;">
                <div><strong>🏭 Fournisseur :</strong> ${item.supplier || 'N/A'}</div>
                <div><strong>📍 Emplacement :</strong> ${item.loc || 'Silo'}</div>
                <div><strong>⚠️ Seuil d'alerte :</strong> ${Number(item.seuil).toLocaleString('fr-FR')} Kg</div>
                <div><strong>💰 Valeur du stock :</strong> ${((Number(item.stock) || 0) * (Number(item.price) || 0)).toLocaleString('fr-FR')} DH</div>
            </div>

            <div class="btn-action-row">
                <button onclick="ajusterStock(${item.id}, 1)" class="btn-action-sheet btn-in-stock">
                    📥 + Entrée Matière
                </button>
                <button onclick="ajusterStock(${item.id}, -1)" class="btn-action-sheet btn-out-stock">
                    📤 - Sortie Prod
                </button>
            </div>

            <button onclick="deleteItem(${item.id})" class="btn-delete-item">
                🗑️ Supprimer cette matière
            </button>
        `;

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    function ajusterStock(id, dir) {
        const val = prompt(dir > 0 ? "Quantité entrée en stock (Kg) :" : "Quantité consommée pour production (Kg) :");
        if (val && !isNaN(val)) {
            const list = getItems();
            const m = list.find(x => x.id === id);
            if (m) {
                m.stock = Math.max(0, m.stock + (dir * parseInt(val)));
                saveItems(list);
                openDetail(id);
            }
        }
    }

    function deleteItem(id) {
        if (confirm("Confirmer la suppression de cette matière ?")) {
            let list = getItems();
            list = list.filter(x => x.id !== id);
            saveItems(list);
            closeDetail();
        }
    }

    // Filtres & Recherche
    document.getElementById('search-input').addEventListener('input', renderList);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderList();
        });
    });

    // Close on overlay click
    [document.getElementById('add-modal'), document.getElementById('detail-modal')].forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

    // Init
    renderList();
    updateKPIs();
</script>
</body>
</html>

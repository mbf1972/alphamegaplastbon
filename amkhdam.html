<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#164e63">
    <title>Ouvriers & RH — AMplast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Ouvriers : Bleu Cyan, Azur Océan & Ambre */
            --primary: #0891b2;
            --primary-dark: #164e63;
            --primary-light: #06b6d4;
            --primary-soft: #22d3ee;
            --primary-subtle: #ecfeff;

            --accent: #f59e0b;
            --accent-deep: #d97706;
            --accent-soft: #fef3c7;

            --bg-body: #e5f6f9;
            --bg-app: #f4fcfe;
            --card-bg: #ffffff;

            --text-main: #082f3a;
            --text-muted: #486e7a;
            --text-dim: #769ba7;
            --amount-color: #0891b2;
            --line: rgba(8, 145, 178, 0.12);

            --status-regle: #059669;
            --status-regle-bg: #d1fae5;
            --status-echu: #dc2626;
            --status-echu-bg: #fee2e2;
            --status-attente: #d97706;
            --status-attente-bg: #fef3c7;

            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 55% 45% at 90% 0%, rgba(34, 211, 238, 0.30), transparent 65%),
                radial-gradient(ellipse 45% 40% at 0% 100%, rgba(245, 158, 11, 0.18), transparent 60%);
            pointer-events: none; z-index: 0;
        }

        button { font: inherit; }
        :focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

        .app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            min-height: 100vh; min-height: 100dvh;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #f8fdff 0%, #edf8fa 100%);
            box-shadow: 0 24px 70px rgba(22, 78, 99, 0.16), 0 0 0 1px rgba(8, 145, 178, 0.08);
        }

        /* ===== HEADER ===== */
        .app-header {
            position: relative;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 52px;
            color: #fff;
            background:
                radial-gradient(circle at 90% -10%, rgba(34, 211, 238, 0.45), transparent 50%),
                radial-gradient(circle at 0% 120%, rgba(245, 158, 11, 0.28), transparent 45%),
                linear-gradient(155deg, #164e63 0%, #0e7490 55%, #0891b2 100%);
            border-radius: 0 0 32px 32px;
            overflow: hidden;
        }

        .app-header::before {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.14) 1px, transparent 1.3px);
            background-size: 16px 16px;
            -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            mask-image: linear-gradient(135deg, #000 0%, transparent 60%);
            pointer-events: none;
        }

        .header-top {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

        .back-btn {
            width: 40px; height: 40px; flex-shrink: 0;
            display: grid; place-items: center;
            border-radius: 14px; color: #fff; text-decoration: none;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.24);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s var(--ease), background 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.26); transform: translateX(-2px); }
        .back-btn:active { transform: scale(0.92); }

        .brand-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px; font-weight: 700; letter-spacing: 2.4px;
            color: #a5f3fc; text-transform: uppercase;
        }
        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1;
        }

        .header-actions { display: flex; align-items: center; }
        .btn-new {
            display: flex; align-items: center; gap: 6px;
            padding: 10px 14px; border: 0; border-radius: 14px; cursor: pointer;
            font-size: 12.5px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.40);
            transition: transform 0.2s var(--ease), box-shadow 0.2s;
        }
        .btn-new:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(217, 119, 6, 0.50); }
        .btn-new:active { transform: scale(0.95); }

        /* Carte Masse Salariale (chevauche le header) */
        .total-solde {
            position: relative; z-index: 6;
            margin: -30px 16px 0;
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: #fff; border-radius: 22px;
            box-shadow: 0 14px 32px -8px rgba(22, 78, 99, 0.22), 0 0 0 1px var(--line);
        }
        .total-label {
            display: block;
            font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
            color: var(--text-muted);
        }
        .total-amount {
            display: block; margin-top: 2px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px; font-weight: 800; letter-spacing: -0.6px;
            color: var(--primary);
        }
        .total-badge {
            flex-shrink: 0;
            padding: 7px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 800; white-space: nowrap;
            color: var(--primary-dark); background: #cffafe; border: 1px solid #a5f3fc;
        }

        /* ===== TOOLBAR COLLANTE (SEARCH + FILTERS) ===== */
        .toolbar {
            position: sticky; top: 0; z-index: 100;
            padding: 14px 16px 10px;
            background: rgba(248, 253, 255, 0.90);
            backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
        }
        .search-container { position: relative; margin-bottom: 10px; }
        .search-input {
            width: 100%; padding: 13px 16px 13px 44px;
            font-size: 13.5px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
            box-shadow: 0 4px 14px -6px rgba(22, 78, 99, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input::placeholder { color: var(--text-dim); font-weight: 600; }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(8, 145, 178, 0.16); }
        .search-icon {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            font-size: 15px; opacity: 0.55; pointer-events: none;
        }

        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex-shrink: 0; white-space: nowrap;
            padding: 8px 15px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer;
            font-size: 12px; font-weight: 800; color: var(--text-muted); background: #fff;
            transition: all 0.2s var(--ease);
        }
        .tab-btn:hover { border-color: rgba(8, 145, 178, 0.5); color: var(--primary); }
        .tab-btn.active {
            color: #fff; border-color: transparent;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 6px 14px -4px rgba(8, 145, 178, 0.45);
        }

        /* ===== STATS ===== */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 6px 16px 4px; }
        .stat-card {
            position: relative; overflow: hidden;
            padding: 10px 12px 10px; border-radius: 16px;
            background: #fff; border: 1px solid var(--line);
            box-shadow: 0 4px 14px -8px rgba(22, 78, 99, 0.10);
        }
        .stat-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--c, var(--primary-soft));
        }
        .stat-card.s-regle   { --c: var(--status-regle); }
        .stat-card.s-echu    { --c: var(--status-echu); }
        .stat-card.s-attente { --c: var(--status-attente); }
        .stat-label {
            display: flex; align-items: center; gap: 5px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
            color: var(--c); margin-bottom: 3px;
        }
        .stat-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
        .stat-val {
            display: block; font-family: 'Outfit', sans-serif;
            font-size: 12.5px; font-weight: 800; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ===== LISTE EMPLOYÉS ===== */
        .items-list { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 8px; }

        .item-card {
            position: relative; overflow: hidden; cursor: pointer;
            display: flex; align-items: center; gap: 13px;
            padding: 13px 14px 13px 18px;
            background: var(--card-bg); border: 1px solid var(--line); border-radius: 20px;
            box-shadow: 0 6px 18px -8px rgba(22, 78, 99, 0.10), 0 1px 2px rgba(0,0,0,0.03);
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s;
            animation: cardIn 0.45s var(--ease) both;
        }
        .item-card:hover {
            transform: translateY(-3px);
            border-color: rgba(8, 145, 178, 0.4);
            box-shadow: 0 16px 30px -10px rgba(22, 78, 99, 0.18);
        }
        .item-card:active { transform: scale(0.98); transition-duration: 0.08s; }
        .item-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--status-c); }
        .item-card.regle   { --status-c: var(--status-regle); }
        .item-card.attente { --status-c: var(--status-attente); }
        .item-card.echu    { --status-c: var(--status-echu); }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: none; }
        }

        .avatar {
            position: relative; flex-shrink: 0;
            width: 48px; height: 48px; border-radius: 16px;
            display: grid; place-items: center;
            font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; color: #fff;
            background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            box-shadow: 0 8px 16px -6px rgba(8, 145, 178, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .avatar::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit;
            background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
            pointer-events: none;
        }

        .card-content { flex: 1; min-width: 0; }
        .item-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14.5px; font-weight: 800; letter-spacing: -0.2px; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-meta-line {
            display: flex; align-items: center; gap: 6px; margin-top: 2px;
            font-size: 11px; font-weight: 700; color: var(--text-dim);
            flex-wrap: wrap;
        }

        .cat-tag {
            background: #ecfeff; color: var(--primary);
            padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
        }

        .amount-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 7px; }
        .amount {
            font-family: 'Outfit', sans-serif; font-size: 14.5px; font-weight: 800; letter-spacing: -0.3px;
            color: var(--primary);
        }

        .status-pill {
            padding: 4px 10px; border-radius: 999px;
            font-size: 9.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
        }
        .pill-regle   { background: var(--status-regle-bg);   color: var(--status-regle); }
        .pill-attente { background: var(--status-attente-bg); color: var(--status-attente); }
        .pill-echu    { background: var(--status-echu-bg);    color: var(--status-echu); }

        .empty-state {
            text-align: center; padding: 44px 20px; color: var(--text-muted);
            font-size: 13px; font-weight: 700;
        }
        .empty-icon { font-size: 34px; margin-bottom: 8px; }
        .empty-title { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .empty-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
        .btn-empty {
            padding: 9px 18px; border-radius: 12px; border: 0; cursor: pointer;
            font-size: 12px; font-weight: 800; color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
        }

        .eco-footer {
            margin-top: auto; padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
            text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
        }

        /* ===== MODAL DETAIL OUVRIER (BOTTOM SHEET) ===== */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: flex-end; justify-content: center;
            background: rgba(22, 78, 99, 0.55);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .modal-overlay.open { display: flex; }

        .modal-sheet {
            width: 100%; max-width: 440px; max-height: 90vh; max-height: 90dvh;
            display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg-app);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -16px 50px rgba(0,0,0,0.28);
            animation: slideUp 0.35s var(--ease);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

        .modal-header {
            position: relative; flex-shrink: 0; overflow: hidden;
            padding: 22px 20px 18px; color: #fff;
            background:
                radial-gradient(circle at 90% 0%, rgba(34, 211, 238, 0.40), transparent 55%),
                radial-gradient(circle at 0% 120%, rgba(245, 158, 11, 0.28), transparent 50%),
                linear-gradient(155deg, #164e63, #0e7490 60%, #0891b2);
        }
        .modal-header::before {
            content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.35);
        }
        .modal-close {
            position: absolute; top: 16px; right: 14px;
            width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.25); border-radius: 12px;
            display: grid; place-items: center; cursor: pointer;
            font-size: 20px; line-height: 1; color: #fff; background: rgba(255,255,255,0.16);
            transition: background 0.2s, transform 0.2s var(--ease);
        }
        .modal-close:hover { background: rgba(245, 158, 11, 0.5); transform: rotate(90deg); }
        .modal-title {
            padding-right: 44px; margin-top: 6px;
            font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.2;
        }
        .modal-subtitle { margin-top: 3px; font-size: 11.5px; font-weight: 700; color: #a5f3fc; }

        .modal-body {
            padding: 16px 18px 28px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-body::-webkit-scrollbar { display: none; width: 0; height: 0; }

        .info-card {
            background: #fff;
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 4px 14px -6px rgba(22, 78, 99, 0.08);
            border: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 8px;
        }

        .btn-action-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .btn-action-sheet {
            padding: 12px; border-radius: 14px; font-size: 12.5px; font-weight: 800;
            text-align: center; text-decoration: none; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s var(--ease);
        }
        .btn-action-sheet:active { transform: scale(0.96); }

        .btn-call {
            background: #ecfeff; color: var(--primary-dark);
            border: 1.5px solid #a5f3fc;
        }
        .btn-call:hover { background: #cffafe; }

        .btn-status-act {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            box-shadow: 0 6px 16px -6px rgba(8, 145, 178, 0.55);
        }
        .btn-status-act:hover { transform: translateY(-1px); }

        .btn-delete-item {
            background: #fff1f2; color: #be123c; border: 1px solid #fecdd3;
            padding: 11px; border-radius: 12px; font-size: 12px; font-weight: 800;
            cursor: pointer; margin-top: 4px; transition: all 0.15s;
        }
        .btn-delete-item:hover { background: #ffe4e6; }

        /* ===== MODAL NOUVEL OUVRIER ===== */
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
        .form-group label { font-size: 11.5px; font-weight: 800; color: #374151; }
        .form-control {
            width: 100%; padding: 11px 13px; outline: none;
            font-size: 13px; font-weight: 700; color: var(--text-main);
            background: #fff; border: 1.5px solid #cbd5e1; border-radius: 12px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.18);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn-submit {
            padding: 13px 18px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white; font-size: 13.5px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 18px rgba(8, 145, 178, 0.35);
            transition: all 0.2s; margin-top: 6px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(8, 145, 178, 0.45); }
        .btn-submit:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <a href="index.html" class="back-btn" title="Retour au Menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="brand-meta">
                    <div class="brand-name">ÉQUIPE &amp; RH</div>
                    <div class="header-title">Ouvriers &amp; Collaborateurs</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-new" onclick="openAddModal()">+ Nouveau</button>
            </div>
        </div>
    </header>

    <!-- Carte Masse Salariale (chevauchement) -->
    <div class="total-solde">
        <div>
            <span class="total-label">💼 Masse Salariale Mensuelle</span>
            <span class="total-amount" id="highlight-masse">0 DH</span>
        </div>
        <div class="total-badge" id="kpi-count">5 employés</div>
    </div>

    <!-- Toolbar sticky (Recherche + Filtres) -->
    <div class="toolbar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="Rechercher nom, poste, matricule..." autocomplete="off">
        </div>

        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">Tous</button>
            <button class="tab-btn" data-filter="Extrusion">Extrusion</button>
            <button class="tab-btn" data-filter="Maintenance">Maintenance</button>
            <button class="tab-btn" data-filter="Manutention">Manutention</button>
            <button class="tab-btn" data-filter="Contrôle Qualité">Qualité</button>
        </div>
    </div>

    <!-- Mini stats bar -->
    <div class="stats-bar">
        <div class="stat-card s-regle">
            <span class="stat-label">Présents</span>
            <span class="stat-val" id="kpi-presents">-</span>
        </div>
        <div class="stat-card s-attente">
            <span class="stat-label">En Congé</span>
            <span class="stat-val" id="kpi-conges">-</span>
        </div>
        <div class="stat-card s-echu">
            <span class="stat-label">Absents</span>
            <span class="stat-val" id="kpi-absents">0</span>
        </div>
    </div>

    <!-- Items Cards Grid -->
    <div class="items-list" id="items-list"></div>

    <div class="eco-footer">🌿 AMplast • Gestion des Ressources Humaines &amp; Équipes</div>
</div>

<!-- ===== MODAL DETAIL OUVRIER (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeDetail()">×</button>
            <div class="modal-title" id="det-name">Employé</div>
            <div class="modal-subtitle" id="det-cat">Poste &amp; Matricule</div>
        </div>
        <div class="modal-body" id="detail-body">
            <!-- Content injected dynamically -->
        </div>
    </div>
</div>

<!-- ===== MODAL NOUVEL OUVRIER (BOTTOM SHEET) ===== -->
<div class="modal-overlay" id="add-modal">
    <div class="modal-sheet">
        <div class="modal-header">
            <button class="modal-close" onclick="closeAddModal()">×</button>
            <div class="modal-title">Nouvel Ouvrier</div>
            <div class="modal-subtitle">Enregistrement RH</div>
        </div>
        <form id="add-form" class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>Matricule *</label>
                    <input type="text" id="f-mat" class="form-control" placeholder="EMP-006" required>
                </div>
                <div class="form-group">
                    <label>Nom &amp; Prénom *</label>
                    <input type="text" id="f-name" class="form-control" placeholder="Nom complet" required>
                </div>
            </div>
            <div class="form-group">
                <label>Poste occupé *</label>
                <input type="text" id="f-poste" class="form-control" placeholder="Ex: Opérateur Extrudeuse" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Département *</label>
                    <select id="f-cat" class="form-control" required>
                        <option value="Extrusion">Extrusion</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Manutention">Manutention</option>
                        <option value="Contrôle Qualité">Contrôle Qualité</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Shift / Équipe</label>
                    <select id="f-shift" class="form-control">
                        <option value="Équipe Matin (6h-14h)">Équipe Matin (6h-14h)</option>
                        <option value="Équipe Soir (14h-22h)">Équipe Soir (14h-22h)</option>
                        <option value="Équipe Nuit (22h-6h)">Équipe Nuit (22h-6h)</option>
                        <option value="Journée Normale">Journée Normale</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Téléphone</label>
                    <input type="tel" id="f-phone" class="form-control" placeholder="0661-000000">
                </div>
                <div class="form-group">
                    <label>Salaire de base (DH)</label>
                    <input type="number" id="f-salary" class="form-control" placeholder="5000" value="5000">
                </div>
            </div>
            <button type="submit" class="btn-submit">Enregistrer l'Employé</button>
        </form>
    </div>
</div>

<script>
    const DEFAULT_DATA = [
        { id: 1, matricule: "EMP-001", name: "Mohamed El Amrani", poste: "Chef d'équipe Extrusion", cat: "Extrusion", shift: "Équipe Matin (6h-14h)", phone: "+212 661 23 45 67", salary: 6500, status: "Présent" },
        { id: 2, matricule: "EMP-002", name: "Youssef Bennani", poste: "Opérateur Ligne 1", cat: "Extrusion", shift: "Équipe Matin (6h-14h)", phone: "+212 662 34 56 78", salary: 4800, status: "Présent" },
        { id: 3, matricule: "EMP-003", name: "Karim Tazi", poste: "Technicien Électromécanicien", cat: "Maintenance", shift: "Journée Normale", phone: "+212 663 45 67 89", salary: 7200, status: "Présent" },
        { id: 4, matricule: "EMP-004", name: "Hamid Chraibi", poste: "Opérateur Broyeur & Silos", cat: "Manutention", shift: "Équipe Soir (14h-22h)", phone: "+212 664 56 78 90", salary: 4500, status: "Présent" },
        { id: 5, matricule: "EMP-005", name: "Salma Mansouri", poste: "Contrôleuse Qualité Tuyaux", cat: "Contrôle Qualité", shift: "Journée Normale", phone: "+212 665 67 89 01", salary: 5400, status: "Congé" }
    ];
    const STORAGE_KEY = 'amplast_ouvriers';

    function getItems() {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            try { return JSON.parse(data); } catch(e) {}
        }
        return DEFAULT_DATA;
    }

    function saveItems(list) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        renderList();
        updateKPIs();
    }

    let currentFilter = 'all';

    function renderList() {
        const list = getItems();
        const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
        const container = document.getElementById('items-list');

        const filtered = list.filter(item => {
            const str = JSON.stringify(item).toLowerCase();
            const matchSearch = str.includes(searchVal);
            const matchFilter = currentFilter === 'all' || item.cat === currentFilter;
            return matchSearch && matchFilter;
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">👷</div>
                    <div class="empty-title">Aucun employé trouvé</div>
                    <div class="empty-sub">Modifiez votre recherche ou ajoutez un nouveau profil.</div>
                    <button class="btn-empty" onclick="openAddModal()">+ Nouvel employé</button>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(item => {
            const isPresent = item.status === 'Présent';
            const isConge = item.status === 'Congé';
            const cardClass = isPresent ? 'regle' : (isConge ? 'attente' : 'echu');
            const pillClass = isPresent ? 'pill-regle' : (isConge ? 'pill-attente' : 'pill-echu');

            return `
                <div class="item-card ${cardClass}" onclick="openDetail(${item.id})">
                    <div class="avatar">${item.name.charAt(0)}</div>
                    <div class="card-content">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta-line">
                            <span class="cat-tag">${item.cat}</span>
                            <span>• ${item.poste}</span>
                        </div>
                        <div class="amount-row">
                            <span class="amount">${Number(item.salary).toLocaleString('fr-FR')} <span style="font-size:10px;font-weight:700;">DH/m</span></span>
                            <span class="status-pill ${pillClass}">${item.status}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateKPIs() {
        const list = getItems();
        document.getElementById('kpi-count').textContent = `${list.length} employés`;

        const presents = list.filter(o => o.status === 'Présent').length;
        const conges = list.filter(o => o.status === 'Congé').length;
        const absents = list.filter(o => o.status === 'Absent').length;

        document.getElementById('kpi-presents').textContent = `${presents} présents`;
        document.getElementById('kpi-conges').textContent = `${conges} congés`;
        document.getElementById('kpi-absents').textContent = `${absents}`;

        const totalPaie = list.reduce((s, o) => s + (Number(o.salary) || 0), 0);
        document.getElementById('highlight-masse').textContent = `${totalPaie.toLocaleString('fr-FR')} DH`;
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('open');
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.remove('open');
    }

    document.getElementById('add-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const list = getItems();
        const newItem = {
            id: Date.now(),
            matricule: document.getElementById('f-mat').value.trim() || ('EMP-' + Date.now().toString().slice(-3)),
            name: document.getElementById('f-name').value.trim(),
            poste: document.getElementById('f-poste').value.trim(),
            cat: document.getElementById('f-cat').value,
            shift: document.getElementById('f-shift').value,
            phone: document.getElementById('f-phone').value.trim() || '+212 600 00 00 00',
            salary: parseFloat(document.getElementById('f-salary').value) || 5000,
            status: 'Présent'
        };

        list.unshift(newItem);
        saveItems(list);
        document.getElementById('add-form').reset();
        closeAddModal();
    });

    function openDetail(id) {
        const list = getItems();
        const item = list.find(x => x.id === id);
        if (!item) return;

        document.getElementById('det-name').textContent = item.name;
        document.getElementById('det-cat').textContent = `${item.matricule} • ${item.cat}`;

        const isPresent = item.status === 'Présent';
        const isConge = item.status === 'Congé';
        const pillClass = isPresent ? 'pill-regle' : (isConge ? 'pill-attente' : 'pill-echu');

        const body = document.getElementById('detail-body');
        body.innerHTML = `
            <div class="info-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:800; color:var(--text-muted); text-transform:uppercase;">Poste &amp; Statut</span>
                    <span class="status-pill ${pillClass}">${item.status}</span>
                </div>
                <div style="font-family:'Outfit'; font-size:18px; font-weight:800; color:var(--text-main); margin-top:4px;">
                    ${item.poste}
                </div>
                <div style="font-size:15px; font-weight:800; color:var(--primary); margin-top:2px;">
                    💰 ${Number(item.salary).toLocaleString('fr-FR')} DH / mois
                </div>
            </div>

            <div class="info-card" style="font-size:12px; gap:8px;">
                <div><strong>⏰ Shift :</strong> ${item.shift}</div>
                <div><strong>📞 Téléphone :</strong> <a href="tel:${item.phone}" style="color:var(--primary-light); text-decoration:none; font-weight:700;">${item.phone}</a></div>
                <div><strong>🏢 Département :</strong> <span class="cat-tag">${item.cat}</span></div>
                <div><strong>🔢 Matricule :</strong> ${item.matricule}</div>
            </div>

            <div class="btn-action-row">
                <a href="tel:${item.phone}" class="btn-action-sheet btn-call">
                    📞 Appeler
                </a>
                <button onclick="toggleStatut(${item.id})" class="btn-action-sheet btn-status-act">
                    🔄 Statut
                </button>
            </div>

            <button onclick="deleteItem(${item.id})" class="btn-delete-item">
                🗑️ Supprimer cet employé
            </button>
        `;

        document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detail-modal').classList.remove('open');
    }

    function toggleStatut(id) {
        const list = getItems();
        const o = list.find(x => x.id === id);
        if (o) {
            const opt = prompt("Nouveau statut :\n1 = Présent\n2 = Congé\n3 = Absent");
            if (opt === '1') o.status = 'Présent';
            else if (opt === '2') o.status = 'Congé';
            else if (opt === '3') o.status = 'Absent';
            saveItems(list);
            openDetail(id);
        }
    }

    function deleteItem(id) {
        if (confirm("Confirmer la suppression de cet employé ?")) {
            let list = getItems();
            list = list.filter(x => x.id !== id);
            saveItems(list);
            closeDetail();
        }
    }

    // Filtres & Recherche
    document.getElementById('search-input').addEventListener('input', renderList);

    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderList();
        });
    });

    // Close on overlay click
    [document.getElementById('add-modal'), document.getElementById('detail-modal')].forEach(m => {
        m.addEventListener('click', (e) => {
            if (e.target === m) m.classList.remove('open');
        });
    });

    // Init
    renderList();
    updateKPIs();
</script>
</body>
</html>
